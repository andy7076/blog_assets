<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>烟雨江南</title>
  <style>
    :root {
      --ink: #142421;
      --pine: #25433a;
      --moss: #617963;
      --paper: #edf0e7;
      --mist: rgba(233, 239, 232, 0.76);
      --tile: #22302f;
      --vermillion: #9b3d2d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dfe7df;
      color: var(--ink);
      font-family: "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
    }

    body {
      min-height: 100vh;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.74) 0 9%, transparent 31%),
        radial-gradient(circle at 80% 18%, rgba(220, 229, 219, 0.56) 0 12%, transparent 34%),
        linear-gradient(180deg, #d8e3dd 0%, #eef1e7 44%, #bdcbbc 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: 0;
      opacity: 0.42;
      background-image:
        linear-gradient(115deg, transparent 0 14px, rgba(31, 49, 44, 0.06) 15px 16px, transparent 17px 31px),
        radial-gradient(circle at 35% 38%, rgba(21, 38, 34, 0.12) 0 2px, transparent 3px);
      background-size: 42px 42px, 90px 76px;
      filter: blur(0.3px);
      transform: rotate(-2deg);
      mix-blend-mode: multiply;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.36), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.3)),
        radial-gradient(ellipse at 50% 16%, transparent 0 34%, rgba(58, 75, 62, 0.1) 100%);
    }

    .ink-wash,
    .mountains,
    .town,
    .water,
    .rain,
    .mist,
    .content {
      position: absolute;
      inset: 0;
    }

    .ink-wash {
      z-index: 1;
      opacity: 0.85;
      filter: url("#ink");
    }

    .wash {
      position: absolute;
      border-radius: 48% 52% 58% 42% / 44% 48% 52% 56%;
      background: rgba(40, 65, 58, 0.22);
      transform-origin: center;
      animation: breathe 9s ease-in-out infinite alternate;
    }

    .wash.one {
      width: 42vw;
      height: 22vh;
      left: 3vw;
      top: 19vh;
    }

    .wash.two {
      width: 48vw;
      height: 26vh;
      right: 5vw;
      top: 12vh;
      opacity: 0.78;
      animation-delay: -3s;
    }

    .wash.three {
      width: 74vw;
      height: 28vh;
      left: 12vw;
      bottom: 18vh;
      opacity: 0.28;
      animation-delay: -5s;
    }

    @keyframes breathe {
      from {
        transform: scale(0.98) rotate(-1deg);
        filter: blur(14px);
      }
      to {
        transform: scale(1.05) rotate(1deg);
        filter: blur(20px);
      }
    }

    .mountains {
      z-index: 2;
      opacity: 0.7;
    }

    .mountain {
      position: absolute;
      left: -8vw;
      right: -8vw;
      height: 40vh;
      bottom: 36vh;
      background: linear-gradient(180deg, rgba(40, 64, 57, 0.34), rgba(71, 99, 79, 0.08));
      clip-path: polygon(0% 76%, 8% 58%, 16% 68%, 25% 35%, 35% 68%, 46% 45%, 58% 70%, 68% 37%, 80% 68%, 91% 48%, 100% 76%, 100% 100%, 0 100%);
      filter: blur(3px);
    }

    .mountain.far {
      bottom: 42vh;
      opacity: 0.42;
      transform: scaleX(1.08);
      filter: blur(9px);
      background: linear-gradient(180deg, rgba(31, 51, 47, 0.22), rgba(114, 139, 113, 0.04));
    }

    .mist {
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 0 24%, rgba(242, 245, 238, 0.68) 41%, transparent 58%),
        linear-gradient(180deg, transparent 43%, rgba(239, 242, 234, 0.72) 55%, transparent 72%);
      animation: mistMove 16s ease-in-out infinite alternate;
    }

    @keyframes mistMove {
      from {
        transform: translateX(-2vw);
        opacity: 0.78;
      }
      to {
        transform: translateX(2vw);
        opacity: 1;
      }
    }

    .town {
      z-index: 5;
      bottom: 0;
      top: auto;
      height: 50vh;
    }

    .bank {
      position: absolute;
      left: -5vw;
      right: -5vw;
      bottom: 20vh;
      height: 9vh;
      background: linear-gradient(180deg, rgba(78, 98, 75, 0.34), rgba(44, 64, 56, 0.26));
      clip-path: polygon(0 66%, 16% 44%, 31% 58%, 48% 37%, 64% 56%, 80% 42%, 100% 62%, 100% 100%, 0 100%);
      filter: blur(1px);
    }

    .houses {
      position: absolute;
      left: 5vw;
      right: 4vw;
      bottom: 25vh;
      display: flex;
      align-items: flex-end;
      gap: clamp(8px, 1.3vw, 18px);
      opacity: 0.94;
    }

    .house {
      position: relative;
      width: clamp(88px, 12vw, 168px);
      height: clamp(52px, 7vw, 92px);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.52), rgba(216, 222, 211, 0.78)),
        var(--paper);
      border: 1px solid rgba(34, 48, 47, 0.22);
      box-shadow: inset 0 -9px 16px rgba(41, 57, 52, 0.08);
    }

    .house:nth-child(2),
    .house:nth-child(5) {
      height: clamp(65px, 8vw, 112px);
    }

    .house::before {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      top: -32%;
      height: 38%;
      background: var(--tile);
      clip-path: polygon(0 78%, 50% 0, 100% 78%, 95% 100%, 5% 100%);
      box-shadow: 0 6px 8px rgba(26, 43, 39, 0.2);
    }

    .house::after {
      content: "";
      position: absolute;
      width: 24%;
      height: 38%;
      left: 39%;
      bottom: 0;
      background: rgba(38, 52, 48, 0.52);
      border-top: 5px solid rgba(155, 61, 45, 0.7);
      box-shadow:
        -34px -13px 0 -12px rgba(38, 52, 48, 0.45),
        34px -13px 0 -12px rgba(38, 52, 48, 0.45);
    }

    .willow {
      position: absolute;
      width: 15vw;
      min-width: 120px;
      height: 31vh;
      left: 8vw;
      bottom: 25vh;
      transform-origin: 40% 0;
      animation: willow 5s ease-in-out infinite alternate;
    }

    .willow::before {
      content: "";
      position: absolute;
      left: 44%;
      top: 2%;
      width: 9px;
      height: 78%;
      background: linear-gradient(90deg, #30473d, #72846d);
      border-radius: 100% 30% 20% 80%;
      transform: rotate(8deg);
    }

    .branch {
      position: absolute;
      top: 0;
      width: 1.5px;
      height: 75%;
      background: linear-gradient(180deg, rgba(41, 75, 54, 0.82), rgba(96, 125, 84, 0.16));
      border-radius: 50%;
      transform-origin: top;
    }

    .branch:nth-child(1) { left: 18%; height: 83%; transform: rotate(18deg); }
    .branch:nth-child(2) { left: 27%; height: 94%; transform: rotate(9deg); }
    .branch:nth-child(3) { left: 38%; height: 87%; transform: rotate(2deg); }
    .branch:nth-child(4) { left: 49%; height: 92%; transform: rotate(-8deg); }
    .branch:nth-child(5) { left: 59%; height: 76%; transform: rotate(-16deg); }
    .branch:nth-child(6) { left: 68%; height: 88%; transform: rotate(-22deg); }

    @keyframes willow {
      from { transform: rotate(-1deg); }
      to { transform: rotate(2deg); }
    }

    .bridge {
      position: absolute;
      right: 9vw;
      bottom: 18vh;
      width: min(34vw, 430px);
      height: min(18vw, 210px);
      border: clamp(8px, 1vw, 14px) solid rgba(37, 57, 53, 0.72);
      border-bottom: 0;
      border-radius: 52% 52% 0 0 / 82% 82% 0 0;
      opacity: 0.78;
      filter: drop-shadow(0 10px 8px rgba(45, 55, 45, 0.12));
    }

    .bridge::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -1px;
      height: 72%;
      border: clamp(7px, 0.8vw, 12px) solid rgba(234, 238, 228, 0.9);
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 84% 84% 0 0;
      background: rgba(232, 237, 226, 0.36);
    }

    .bridge::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -7%;
      height: 14%;
      background: rgba(39, 55, 52, 0.58);
      clip-path: polygon(0 48%, 100% 21%, 100% 100%, 0 100%);
    }

    .boat {
      position: absolute;
      left: 28vw;
      bottom: 15vh;
      width: min(24vw, 250px);
      height: 6vh;
      animation: boat 18s linear infinite;
      opacity: 0.86;
    }

    .boat::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background: rgba(37, 49, 46, 0.72);
      clip-path: polygon(0 0, 18% 100%, 82% 100%, 100% 0, 70% 55%, 30% 55%);
    }

    .boat::after {
      content: "";
      position: absolute;
      left: 43%;
      bottom: 32%;
      width: 20%;
      height: 120%;
      background: rgba(232, 236, 225, 0.8);
      border: 1px solid rgba(37, 49, 46, 0.38);
      clip-path: polygon(0 100%, 58% 0, 100% 100%);
    }

    @keyframes boat {
      from { transform: translateX(-10vw); }
      to { transform: translateX(42vw); }
    }

    .water {
      z-index: 6;
      top: auto;
      height: 31vh;
      bottom: 0;
      background:
        linear-gradient(180deg, rgba(194, 211, 199, 0.88), rgba(109, 137, 123, 0.88)),
        repeating-linear-gradient(175deg, rgba(255, 255, 255, 0.28) 0 1px, transparent 1px 20px);
      overflow: hidden;
    }

    .water::before,
    .water::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(38, 57, 51, 0.13) 19px 20px),
        repeating-linear-gradient(90deg, transparent 0 74px, rgba(255, 255, 255, 0.16) 75px 76px);
      transform: skewY(-4deg);
      animation: ripple 7s linear infinite;
      opacity: 0.54;
    }

    .water::after {
      opacity: 0.28;
      animation-duration: 11s;
      transform: skewY(3deg) scale(1.04);
    }

    @keyframes ripple {
      from { background-position: 0 0, 0 0; }
      to { background-position: 90px 28px, 76px 0; }
    }

    .rain {
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -16vh;
      width: 1px;
      height: var(--length);
      left: var(--left);
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.78), rgba(60, 83, 78, 0.18));
      transform: rotate(11deg);
      opacity: var(--opacity);
      animation: fall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes fall {
      to {
        transform: translate3d(-18vw, 126vh, 0) rotate(11deg);
      }
    }

    .content {
      z-index: 7;
      display: grid;
      place-items: start center;
      padding: clamp(42px, 8vh, 80px) 24px;
      pointer-events: none;
    }

    .title-block {
      width: min(760px, 92vw);
      text-align: center;
      color: rgba(20, 36, 33, 0.86);
      text-shadow: 0 2px 18px rgba(255, 255, 255, 0.68);
    }

    .seal {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 16px;
      border: 2px solid var(--vermillion);
      color: var(--vermillion);
      font-size: 18px;
      line-height: 1;
      transform: rotate(4deg);
      background: rgba(237, 240, 231, 0.34);
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 116px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 660px;
      font-size: clamp(17px, 2.2vw, 26px);
      line-height: 1.9;
      color: rgba(28, 48, 42, 0.74);
    }

    .poem {
      position: absolute;
      z-index: 7;
      right: clamp(22px, 6vw, 88px);
      top: clamp(118px, 19vh, 190px);
      display: grid;
      grid-auto-flow: column;
      gap: 13px;
      writing-mode: vertical-rl;
      font-size: clamp(18px, 2.2vw, 28px);
      line-height: 1.7;
      color: rgba(25, 46, 39, 0.7);
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.8);
    }

    .poem span {
      animation: fadeIn 1.8s ease both;
    }

    .poem span:nth-child(2) { animation-delay: 0.35s; }
    .poem span:nth-child(3) { animation-delay: 0.7s; }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 720px) {
      .content {
        padding-top: 58px;
      }

      .poem {
        right: 16px;
        top: 42vh;
        font-size: 18px;
        opacity: 0.86;
      }

      .houses {
        left: -4vw;
        right: -18vw;
        gap: 7px;
      }

      .house {
        width: 90px;
      }

      .willow {
        left: -2vw;
        min-width: 105px;
      }

      .bridge {
        right: -2vw;
        width: 58vw;
        height: 30vw;
      }

      .boat {
        width: 42vw;
        left: 4vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="烟雨江南水墨场景">
    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="ink">
        <feTurbulence type="fractalNoise" baseFrequency="0.013 0.04" numOctaves="2" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </svg>

    <div class="ink-wash" aria-hidden="true">
      <div class="wash one"></div>
      <div class="wash two"></div>
      <div class="wash three"></div>
    </div>

    <div class="mountains" aria-hidden="true">
      <div class="mountain far"></div>
      <div class="mountain"></div>
    </div>

    <section class="content">
      <div class="title-block">
        <div class="seal">江南</div>
        <h1>烟雨江南</h1>
        <p class="subtitle">一蓑烟雨入画来，白墙黛瓦隐于水墨，乌篷轻过小桥。</p>
      </div>
    </section>

    <div class="poem" aria-label="江南诗意短句">
      <span>雨落青石巷</span>
      <span>舟行水云间</span>
      <span>墨色染春山</span>
    </div>

    <div class="town" aria-hidden="true">
      <div class="bank"></div>
      <div class="willow">
        <i class="branch"></i>
        <i class="branch"></i>
        <i class="branch"></i>
        <i class="branch"></i>
        <i class="branch"></i>
        <i class="branch"></i>
      </div>
      <div class="houses">
        <div class="house"></div>
        <div class="house"></div>
        <div class="house"></div>
        <div class="house"></div>
        <div class="house"></div>
      </div>
      <div class="bridge"></div>
      <div class="boat"></div>
    </div>

    <div class="water" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div class="rain" aria-hidden="true" id="rain"></div>
  </main>

  <script>
    const rain = document.getElementById("rain");
    const drops = 150;

    for (let i = 0; i < drops; i += 1) {
      const drop = document.createElement("i");
      drop.className = "drop";
      drop.style.setProperty("--left", `${Math.random() * 118 - 6}vw`);
      drop.style.setProperty("--length", `${34 + Math.random() * 78}px`);
      drop.style.setProperty("--opacity", `${0.22 + Math.random() * 0.48}`);
      drop.style.setProperty("--duration", `${0.72 + Math.random() * 0.72}s`);
      drop.style.setProperty("--delay", `${Math.random() * -2.2}s`);
      rain.appendChild(drop);
    }
  </script>
</body>
</html>
