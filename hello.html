<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #764ba2;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #time { margin-top: 1.5rem; font-size: 1.5rem; min-height: 2rem; }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <button id="showTime">显示当前时间</button>
    <div id="time"></div>

    <script>
        document.getElementById('showTime').addEventListener('click', () => {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleString('zh-CN');
        });
    </script>
</body>
</html>
