<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07122b">
  <title>雷霆突击 Thunder Strike</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07122b;
      --panel: rgba(248, 252, 255, .92);
      --ink: #10223d;
      --muted: #5d6d84;
      --cyan: #20d9ff;
      --pink: #ff3fb4;
      --green: #45f2a1;
      --yellow: #ffe15f;
      --red: #ff5c6c;
      --line: rgba(255, 255, 255, .2);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(41, 220, 255, .25), transparent 30%),
        linear-gradient(180deg, #07122b 0%, #111846 48%, #12051f 100%);
      color: white;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .shell {
      position: relative;
      width: min(100vw, 58vh, 520px);
      height: min(100dvh, 177.78vw, 924px);
      max-height: 100dvh;
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      background: #060c22;
      box-shadow: 0 18px 80px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .18);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #061029;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .topbar,
    .bottombar {
      display: grid;
      gap: 8px;
    }

    .topbar {
      grid-template-columns: 1fr auto;
      align-items: start;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .chip,
    .boss-card,
    .progress-card {
      color: var(--ink);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .55);
      box-shadow: 0 8px 24px rgba(4, 10, 28, .22);
      backdrop-filter: blur(10px);
    }

    .chip {
      min-height: 42px;
      border-radius: 8px;
      padding: 6px 8px;
    }

    .chip span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .chip strong {
      display: block;
      margin-top: 2px;
      font-size: clamp(13px, 3.4vw, 17px);
      line-height: 1.05;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-row {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      pointer-events: auto;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      color: #10223d;
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: 0 8px 24px rgba(4, 10, 28, .24);
    }

    .icon-btn:active,
    .primary:active,
    .secondary:active,
    .lang-btn:active {
      transform: translateY(1px);
    }

    .boss-card,
    .progress-card {
      border-radius: 8px;
      padding: 8px;
    }

    .boss-card {
      display: none;
      gap: 5px;
    }

    .boss-card.visible {
      display: grid;
    }

    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .line span:last-child {
      color: var(--pink);
    }

    .meter {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(16, 34, 61, .14);
    }

    .meter i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--pink));
      box-shadow: 0 0 12px rgba(32, 217, 255, .9);
    }

    .progress-card {
      align-self: end;
      display: grid;
      gap: 5px;
    }

    .power-strip {
      min-height: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      pointer-events: none;
    }

    .power-pill {
      border-radius: 999px;
      padding: 4px 7px;
      color: #061029;
      background: rgba(255, 255, 255, .9);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 0 14px rgba(32, 217, 255, .25);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(7, 18, 43, .22), rgba(7, 18, 43, .82)),
        radial-gradient(circle at 50% 30%, rgba(32, 217, 255, .22), transparent 42%);
      z-index: 5;
    }

    .overlay.hidden {
      display: none;
    }

    .panel {
      width: min(100%, 390px);
      color: var(--ink);
      background: rgba(250, 253, 255, .95);
      border-radius: 8px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .82);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .42);
    }

    .brand {
      display: grid;
      gap: 4px;
      margin-bottom: 16px;
    }

    .brand small {
      color: var(--pink);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 11px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(32px, 9vw, 48px);
      line-height: .98;
      color: #07122b;
      letter-spacing: 0;
    }

    h2 {
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 15px 0;
    }

    .menu-stat {
      padding: 10px;
      border-radius: 8px;
      background: #eef6ff;
      border: 1px solid #d7e4f4;
    }

    .menu-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .menu-stat strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      line-height: 1;
    }

    .actions {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .primary,
    .secondary,
    .lang-btn {
      min-height: 46px;
      border-radius: 8px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .primary {
      background: linear-gradient(135deg, #16d9ff, #39f0a2 48%, #ffe15f);
      color: #07122b;
      box-shadow: 0 10px 28px rgba(32, 217, 255, .3);
    }

    .secondary,
    .lang-btn {
      background: #132542;
      color: white;
    }

    .lang-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 7;
      min-height: 34px;
      padding: 0 10px;
      font-size: 12px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .28);
    }

    .hint {
      margin-top: 12px;
      color: #506179;
      font-size: 12px;
      line-height: 1.45;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 4;
      transform: translate(-50%, -50%);
      min-width: 160px;
      max-width: calc(100% - 28px);
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      color: #07122b;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .3);
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, -58%);
    }

    @media (max-height: 690px) {
      .panel {
        padding: 14px;
      }

      .subtitle,
      .hint {
        font-size: 12px;
      }

      .menu-grid {
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="shell" aria-label="雷霆突击 Thunder Strike">
    <canvas id="game" width="450" height="800"></canvas>

    <section class="hud" aria-hidden="true">
      <div class="topbar">
        <div class="stats">
          <div class="chip"><span data-i18n="score">分数</span><strong id="score">0</strong></div>
          <div class="chip"><span data-i18n="combo">连击</span><strong id="combo">x1</strong></div>
          <div class="chip"><span data-i18n="level">关卡</span><strong id="level">1</strong></div>
        </div>
        <div class="icon-row">
          <button class="icon-btn" id="bombBtn" type="button" aria-label="Bomb">✦</button>
          <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">Ⅱ</button>
        </div>
      </div>

      <div class="bottombar">
        <div class="power-strip" id="powerStrip"></div>
        <div class="boss-card" id="bossCard">
          <div class="line"><span id="bossName">BOSS</span><span id="bossHpText">100%</span></div>
          <div class="meter"><i id="bossMeter"></i></div>
        </div>
        <div class="progress-card">
          <div class="line"><span id="phaseLabel">WAVE</span><span id="hpLabel">HP 3/3</span></div>
          <div class="meter"><i id="waveMeter"></i></div>
        </div>
      </div>
    </section>

    <div class="toast" id="toast"></div>

    <section class="overlay" id="menuOverlay">
      <div class="panel">
        <div class="brand">
          <small>Thunder Strike</small>
          <h1>雷霆突击</h1>
          <p class="subtitle" data-i18n="tagline">拖动指挥战机，突破敌阵，击败每关旗舰。</p>
        </div>
        <div class="menu-grid">
          <div class="menu-stat"><span data-i18n="best">最高分</span><strong id="menuBest">0</strong></div>
          <div class="menu-stat"><span data-i18n="last">本局</span><strong id="menuLast">0</strong></div>
          <div class="menu-stat"><span data-i18n="mode">模式</span><strong data-i18n="modeValue">街机</strong></div>
          <div class="menu-stat"><span data-i18n="control">操控</span><strong data-i18n="controlValue">相对拖动</strong></div>
        </div>
        <div class="actions">
          <button class="primary" id="startBtn" type="button" data-i18n="start">开始突击</button>
          <button class="secondary" id="howBtn" type="button" data-i18n="how">简要说明</button>
        </div>
        <p class="hint" id="menuHint" data-i18n="menuHint">按住屏幕任意位置拖动，战机会保持偏移量跟随，手指不会遮住机体。</p>
      </div>
    </section>

    <section class="overlay hidden" id="pauseOverlay">
      <div class="panel">
        <h2 data-i18n="paused">暂停</h2>
        <p class="subtitle" data-i18n="pauseCopy">战场已冻结，继续后从当前波次恢复。</p>
        <div class="actions">
          <button class="primary" id="resumeBtn" type="button" data-i18n="resume">继续</button>
          <button class="secondary" id="quitBtn" type="button" data-i18n="quit">返回菜单</button>
        </div>
      </div>
    </section>

    <section class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <h2 id="gameOverTitle" data-i18n="gameover">任务结束</h2>
        <p class="subtitle" id="gameOverCopy">Score 0</p>
        <div class="menu-grid">
          <div class="menu-stat"><span data-i18n="score">分数</span><strong id="finalScore">0</strong></div>
          <div class="menu-stat"><span data-i18n="best">最高分</span><strong id="finalBest">0</strong></div>
        </div>
        <div class="actions">
          <button class="primary" id="restartBtn" type="button" data-i18n="restart">重新出击</button>
          <button class="secondary" id="menuBtn" type="button" data-i18n="menu">主菜单</button>
        </div>
      </div>
    </section>

    <button class="lang-btn" id="langBtn" type="button">EN</button>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = 450;
      const H = 800;
      const DPR_LIMIT = 2;
      const STORAGE_KEY = "thunder-strike-best";
      const LANG_KEY = "thunder-strike-lang";
      const storage = {
        get(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch {
            // Storage can be disabled in strict private contexts; gameplay should continue.
          }
        }
      };

      const ui = {
        shell: document.getElementById("shell"),
        menuOverlay: document.getElementById("menuOverlay"),
        pauseOverlay: document.getElementById("pauseOverlay"),
        gameOverOverlay: document.getElementById("gameOverOverlay"),
        score: document.getElementById("score"),
        combo: document.getElementById("combo"),
        level: document.getElementById("level"),
        hpLabel: document.getElementById("hpLabel"),
        waveMeter: document.getElementById("waveMeter"),
        phaseLabel: document.getElementById("phaseLabel"),
        bossCard: document.getElementById("bossCard"),
        bossName: document.getElementById("bossName"),
        bossHpText: document.getElementById("bossHpText"),
        bossMeter: document.getElementById("bossMeter"),
        powerStrip: document.getElementById("powerStrip"),
        menuBest: document.getElementById("menuBest"),
        menuLast: document.getElementById("menuLast"),
        finalScore: document.getElementById("finalScore"),
        finalBest: document.getElementById("finalBest"),
        gameOverCopy: document.getElementById("gameOverCopy"),
        toast: document.getElementById("toast"),
        langBtn: document.getElementById("langBtn")
      };

      const i18n = {
        zh: {
          score: "分数",
          combo: "连击",
          level: "关卡",
          best: "最高分",
          last: "本局",
          mode: "模式",
          modeValue: "街机",
          control: "操控",
          controlValue: "相对拖动",
          tagline: "拖动指挥战机，突破敌阵，击败每关旗舰。",
          start: "开始突击",
          how: "简要说明",
          menuHint: "按住屏幕任意位置拖动，战机会保持偏移量跟随，手指不会遮住机体。",
          paused: "暂停",
          pauseCopy: "战场已冻结，继续后从当前波次恢复。",
          resume: "继续",
          quit: "返回菜单",
          gameover: "任务结束",
          restart: "重新出击",
          menu: "主菜单",
          wave: "波次",
          boss: "旗舰",
          clear: "清场",
          hp: "耐久",
          lives: "命",
          bombs: "炸弹",
          bossIn: "旗舰抵达",
          levelClear: "关卡突破",
          newBest: "新纪录",
          explain: "自动开火；拾取强化；✦ 可引爆全屏炸弹；红圈是受击判定。",
          power: {
            spread: "散弹",
            laser: "激光",
            rapid: "速射",
            shield: "护盾",
            magnet: "磁吸",
            bomb: "炸弹"
          },
          bosses: ["苍穹堡垒", "棱镜女王", "雷暴核心"]
        },
        en: {
          score: "Score",
          combo: "Combo",
          level: "Level",
          best: "Best",
          last: "Run",
          mode: "Mode",
          modeValue: "Arcade",
          control: "Control",
          controlValue: "Relative drag",
          tagline: "Drag to pilot, break enemy waves, and destroy each flagship.",
          start: "Launch Strike",
          how: "Quick Guide",
          menuHint: "Drag anywhere. The fighter follows with a fixed offset so your finger stays clear.",
          paused: "Paused",
          pauseCopy: "The battlefield is frozen and resumes from the current wave.",
          resume: "Resume",
          quit: "Back to Menu",
          gameover: "Mission Over",
          restart: "Restart",
          menu: "Main Menu",
          wave: "Wave",
          boss: "Boss",
          clear: "Clear",
          hp: "HP",
          lives: "Lives",
          bombs: "Bombs",
          bossIn: "Boss Incoming",
          levelClear: "Level Clear",
          newBest: "New Record",
          explain: "Auto fire; collect powerups; ✦ triggers a screen bomb; red ring marks the hitbox.",
          power: {
            spread: "Spread",
            laser: "Laser",
            rapid: "Rapid",
            shield: "Shield",
            magnet: "Magnet",
            bomb: "Bomb"
          },
          bosses: ["Sky Bastion", "Prism Queen", "Storm Core"]
        }
      };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const dist2 = (a, b) => {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
      };
      const rand = (min, max) => min + Math.random() * (max - min);
      const chance = value => Math.random() < value;

      const state = {
        mode: "menu",
        phase: "wave",
        lang: detectLanguage(),
        lastTime: 0,
        elapsed: 0,
        score: 0,
        lastScore: 0,
        best: Number(storage.get(STORAGE_KEY) || 0),
        combo: 1,
        comboTimer: 0,
        level: 1,
        waveClock: 0,
        waveDuration: 36,
        spawnClock: 0,
        clearClock: 0,
        boss: null,
        bossPattern: 0,
        screenShake: 0,
        flash: 0,
        toastClock: 0,
        toastText: "",
        pointer: {
          active: false,
          id: null,
          startX: 0,
          startY: 0,
          baseX: 0,
          baseY: 0
        },
        player: null,
        bullets: [],
        enemyBullets: [],
        enemies: [],
        powerups: [],
        particles: [],
        stars: [],
        keys: new Set()
      };

      const powerDefs = {
        spread: { color: "#35dcff", duration: 12 },
        laser: { color: "#ff4cc8", duration: 10 },
        rapid: { color: "#ffe15f", duration: 11 },
        shield: { color: "#45f2a1", duration: 14 },
        magnet: { color: "#8df0ff", duration: 13 },
        bomb: { color: "#ff6a76", duration: 0 }
      };

      function detectLanguage() {
        const saved = storage.get(LANG_KEY);
        if (saved === "zh" || saved === "en") return saved;
        const browser = (navigator.language || "").toLowerCase();
        return browser.startsWith("zh") ? "zh" : "zh";
      }

      function t(key) {
        const parts = key.split(".");
        let value = i18n[state.lang];
        for (const part of parts) value = value && value[part];
        return value || key;
      }

      function setLanguage(lang) {
        state.lang = lang;
        storage.set(LANG_KEY, lang);
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach(node => {
          node.textContent = t(node.dataset.i18n);
        });
        ui.langBtn.textContent = lang === "zh" ? "EN" : "中文";
        updateHud();
      }

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
        canvas.width = Math.round(W * ratio);
        canvas.height = Math.round(H * ratio);
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function makePlayer() {
        return {
          x: W / 2,
          y: H - 118,
          r: 9,
          bodyR: 20,
          hp: 3,
          maxHp: 3,
          lives: 2,
          bombs: 1,
          invuln: 1.5,
          fireClock: 0,
          powers: {},
          shield: 0
        };
      }

      function resetGame() {
        state.mode = "playing";
        state.phase = "wave";
        state.elapsed = 0;
        state.score = 0;
        state.combo = 1;
        state.comboTimer = 0;
        state.level = 1;
        state.waveClock = 0;
        state.waveDuration = 34;
        state.spawnClock = 0;
        state.clearClock = 0;
        state.boss = null;
        state.bossPattern = 0;
        state.screenShake = 0;
        state.flash = 0;
        state.player = makePlayer();
        state.bullets.length = 0;
        state.enemyBullets.length = 0;
        state.enemies.length = 0;
        state.powerups.length = 0;
        state.particles.length = 0;
        hideOverlays();
        updateHud();
      }

      function seedStars() {
        state.stars.length = 0;
        for (let i = 0; i < 110; i++) {
          state.stars.push({
            x: rand(0, W),
            y: rand(0, H),
            s: rand(.6, 2.4),
            v: rand(26, 96),
            hue: chance(.55) ? "#54e6ff" : chance(.5) ? "#ffffff" : "#ff7ac8"
          });
        }
      }

      function hideOverlays() {
        ui.menuOverlay.classList.add("hidden");
        ui.pauseOverlay.classList.add("hidden");
        ui.gameOverOverlay.classList.add("hidden");
      }

      function showMenu() {
        state.mode = "menu";
        ui.menuOverlay.classList.remove("hidden");
        ui.pauseOverlay.classList.add("hidden");
        ui.gameOverOverlay.classList.add("hidden");
        ui.menuBest.textContent = state.best.toLocaleString();
        ui.menuLast.textContent = state.lastScore.toLocaleString();
        updateHud();
      }

      function showPause() {
        if (state.mode !== "playing") return;
        state.mode = "paused";
        ui.pauseOverlay.classList.remove("hidden");
      }

      function resumeGame() {
        if (state.mode !== "paused") return;
        state.mode = "playing";
        ui.pauseOverlay.classList.add("hidden");
        state.lastTime = performance.now();
      }

      function gameOver() {
        state.mode = "gameover";
        state.lastScore = state.score;
        if (state.score > state.best) {
          state.best = state.score;
          storage.set(STORAGE_KEY, String(state.best));
          toast(t("newBest"));
        }
        ui.finalScore.textContent = state.score.toLocaleString();
        ui.finalBest.textContent = state.best.toLocaleString();
        ui.gameOverCopy.textContent = `${t("level")} ${state.level} · ${t("score")} ${state.score.toLocaleString()}`;
        ui.gameOverOverlay.classList.remove("hidden");
        vibrate([40, 80, 70]);
      }

      function toast(text) {
        state.toastText = text;
        state.toastClock = 1.45;
        ui.toast.textContent = text;
        ui.toast.classList.add("visible");
      }

      function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
      }

      function updateHud() {
        const p = state.player || makePlayer();
        ui.score.textContent = state.score.toLocaleString();
        ui.combo.textContent = `x${state.combo}`;
        ui.level.textContent = String(state.level);
        ui.hpLabel.textContent = `${t("hp")} ${p.hp}/${p.maxHp} · ${t("lives")} ${p.lives} · ${t("bombs")} ${p.bombs}`;
        ui.phaseLabel.textContent = state.phase === "boss" ? t("boss") : state.phase === "clear" ? t("clear") : t("wave");
        const wavePct = state.phase === "wave" ? state.waveClock / state.waveDuration : state.phase === "boss" ? 1 : state.clearClock / 2.5;
        ui.waveMeter.style.width = `${clamp(wavePct, 0, 1) * 100}%`;
        ui.bossCard.classList.toggle("visible", Boolean(state.boss));
        if (state.boss) {
          const hpPct = clamp(state.boss.hp / state.boss.maxHp, 0, 1);
          ui.bossName.textContent = state.boss.name;
          ui.bossHpText.textContent = `${Math.ceil(hpPct * 100)}%`;
          ui.bossMeter.style.width = `${hpPct * 100}%`;
        }
        renderPowerStrip();
      }

      function renderPowerStrip() {
        const p = state.player;
        if (!p) {
          ui.powerStrip.innerHTML = "";
          return;
        }
        const entries = Object.entries(p.powers).filter(([, value]) => value > 0);
        if (p.shield > 0 && !entries.some(([key]) => key === "shield")) entries.push(["shield", p.shield]);
        ui.powerStrip.innerHTML = entries.map(([key, time]) => {
          const color = powerDefs[key] ? powerDefs[key].color : "#fff";
          return `<span class="power-pill" style="box-shadow:0 0 14px ${color};">${t(`power.${key}`)} ${Math.ceil(time)}</span>`;
        }).join("");
      }

      function spawnEnemy(type, x, y) {
        const levelScale = 1 + state.level * .14;
        const defs = {
          scout: { hp: 15, r: 15, score: 90, color: "#35dcff", fire: 2.4, speed: 72 },
          striker: { hp: 28, r: 18, score: 150, color: "#ff4cc8", fire: 1.55, speed: 54 },
          tank: { hp: 56, r: 25, score: 260, color: "#ffe15f", fire: 2.05, speed: 36 },
          drone: { hp: 20, r: 14, score: 120, color: "#45f2a1", fire: 1.8, speed: 84 }
        };
        const d = defs[type];
        state.enemies.push({
          type,
          x,
          y,
          baseX: x,
          hp: Math.round(d.hp * levelScale),
          maxHp: Math.round(d.hp * levelScale),
          r: d.r,
          color: d.color,
          score: d.score,
          t: 0,
          fireClock: rand(.4, d.fire),
          fireRate: d.fire * clamp(1 - state.level * .035, .68, 1),
          speed: d.speed + state.level * 4,
          entered: false
        });
      }

      function spawnWave(dt) {
        state.waveClock += dt;
        state.spawnClock -= dt;
        if (state.spawnClock > 0) return;

        const progress = state.waveClock / state.waveDuration;
        const level = state.level;
        const pace = clamp(.9 - level * .045 - progress * .18, .34, .9);
        state.spawnClock = pace;
        const roll = Math.random();

        if (roll < .34) {
          const count = progress > .55 ? 4 : 3;
          const start = rand(64, W - 64);
          for (let i = 0; i < count; i++) spawnEnemy("scout", clamp(start + (i - (count - 1) / 2) * 46, 35, W - 35), -30 - i * 34);
        } else if (roll < .58) {
          spawnEnemy("striker", rand(52, W - 52), -38);
          if (level > 1 && chance(.65)) spawnEnemy("drone", rand(40, W - 40), -80);
        } else if (roll < .78) {
          spawnEnemy("tank", rand(70, W - 70), -48);
        } else {
          for (let i = 0; i < 2 + Math.min(2, level); i++) {
            spawnEnemy("drone", i % 2 ? W + 30 : -30, -20 - i * 58);
          }
        }

        if (state.waveClock >= state.waveDuration) startBoss();
      }

      function startBoss() {
        state.phase = "boss";
        state.waveClock = state.waveDuration;
        state.spawnClock = 999;
        state.enemies.length = Math.min(state.enemies.length, 10);
        const index = (state.level - 1) % 3;
        const names = t("bosses");
        const hp = [760, 900, 1040][index] + state.level * 170;
        state.bossPattern = index;
        state.boss = {
          type: "boss",
          name: names[index],
          x: W / 2,
          y: -86,
          targetY: 116,
          r: 54,
          hp,
          maxHp: hp,
          t: 0,
          fireClock: .8,
          altClock: 2.2,
          color: ["#35dcff", "#ff4cc8", "#ffe15f"][index],
          score: 2000 + state.level * 400
        };
        toast(t("bossIn"));
        vibrate(35);
      }

      function clearLevel() {
        state.phase = "clear";
        state.clearClock = 0;
        state.boss = null;
        state.enemyBullets.length = 0;
        state.enemies.length = 0;
        toast(t("levelClear"));
        vibrate([25, 40, 25]);
        addScore(1000 + state.level * 350);
      }

      function nextLevel(dt) {
        state.clearClock += dt;
        if (state.clearClock < 2.5) return;
        state.level += 1;
        state.phase = "wave";
        state.waveClock = 0;
        state.waveDuration = clamp(34 + state.level * 2, 34, 48);
        state.spawnClock = .4;
        state.player.hp = clamp(state.player.hp + 1, 1, state.player.maxHp);
      }

      function addScore(amount) {
        state.score += Math.round(amount * state.combo);
      }

      function updatePlayer(dt) {
        const p = state.player;
        p.invuln = Math.max(0, p.invuln - dt);
        p.shield = Math.max(0, p.shield - dt);
        Object.keys(p.powers).forEach(key => {
          p.powers[key] -= dt;
          if (p.powers[key] <= 0) delete p.powers[key];
        });
        state.comboTimer = Math.max(0, state.comboTimer - dt);
        if (state.comboTimer <= 0) state.combo = Math.max(1, Math.floor(state.combo * .75));

        const speed = 275;
        let dx = 0;
        let dy = 0;
        if (state.keys.has("ArrowLeft") || state.keys.has("KeyA")) dx -= 1;
        if (state.keys.has("ArrowRight") || state.keys.has("KeyD")) dx += 1;
        if (state.keys.has("ArrowUp") || state.keys.has("KeyW")) dy -= 1;
        if (state.keys.has("ArrowDown") || state.keys.has("KeyS")) dy += 1;
        if (dx || dy) {
          const len = Math.hypot(dx, dy);
          p.x += dx / len * speed * dt;
          p.y += dy / len * speed * dt;
        }
        p.x = clamp(p.x, 25, W - 25);
        p.y = clamp(p.y, 78, H - 38);

        p.fireClock -= dt;
        const rapid = p.powers.rapid > 0;
        const interval = rapid ? .075 : .135;
        if (p.fireClock <= 0) {
          p.fireClock = interval;
          firePlayer();
        }
      }

      function firePlayer() {
        const p = state.player;
        const spread = p.powers.spread > 0;
        const laser = p.powers.laser > 0;
        if (laser) {
          state.bullets.push({ kind: "laser", x: p.x, y: p.y - 30, vx: 0, vy: -720, r: 8, damage: 14, life: .55, color: "#ff4cc8" });
          state.bullets.push({ kind: "laser", x: p.x - 13, y: p.y - 24, vx: 0, vy: -680, r: 5, damage: 8, life: .5, color: "#ff92de" });
          state.bullets.push({ kind: "laser", x: p.x + 13, y: p.y - 24, vx: 0, vy: -680, r: 5, damage: 8, life: .5, color: "#ff92de" });
        } else {
          state.bullets.push({ kind: "bolt", x: p.x, y: p.y - 26, vx: 0, vy: -610, r: 5, damage: 10, life: 1.2, color: "#35dcff" });
        }
        if (spread) {
          [-.34, -.18, .18, .34].forEach(angle => {
            state.bullets.push({
              kind: "bolt",
              x: p.x,
              y: p.y - 18,
              vx: Math.sin(angle) * 470,
              vy: -Math.cos(angle) * 560,
              r: 4,
              damage: 7,
              life: 1.15,
              color: "#ffe15f"
            });
          });
        }
      }

      function fireEnemy(e) {
        const p = state.player;
        if (!p) return;
        const angleToPlayer = Math.atan2(p.y - e.y, p.x - e.x);
        if (e.type === "scout") {
          enemyBullet(e.x, e.y + 12, angleToPlayer, 150, 6, "#ff6a76");
        } else if (e.type === "striker") {
          [-.22, 0, .22].forEach(a => enemyBullet(e.x, e.y + 15, angleToPlayer + a, 145, 6, "#ff4cc8"));
        } else if (e.type === "tank") {
          for (let i = 0; i < 8; i++) enemyBullet(e.x, e.y, Math.PI * 2 * i / 8 + e.t, 112, 6, "#ffe15f");
        } else {
          enemyBullet(e.x, e.y, Math.PI / 2, 190, 5, "#45f2a1");
          enemyBullet(e.x, e.y, Math.PI / 2 + .28, 180, 5, "#45f2a1");
          enemyBullet(e.x, e.y, Math.PI / 2 - .28, 180, 5, "#45f2a1");
        }
      }

      function fireBoss(b, dt) {
        b.fireClock -= dt;
        b.altClock -= dt;
        const pattern = state.bossPattern;
        if (b.fireClock <= 0) {
          b.fireClock = pattern === 1 ? .42 : pattern === 2 ? .34 : .55;
          if (pattern === 0) {
            const base = Math.PI / 2 + Math.sin(b.t * 1.7) * .35;
            for (let i = -2; i <= 2; i++) enemyBullet(b.x + i * 12, b.y + 35, base + i * .12, 165, 6, "#35dcff");
          } else if (pattern === 1) {
            for (let i = 0; i < 10; i++) {
              const a = Math.PI * 2 * i / 10 + b.t * .65;
              enemyBullet(b.x, b.y, a, 122 + Math.sin(b.t + i) * 18, 5, i % 2 ? "#ff4cc8" : "#35dcff");
            }
          } else {
            const p = state.player;
            const aim = Math.atan2(p.y - b.y, p.x - b.x);
            for (let i = -1; i <= 1; i++) enemyBullet(b.x + i * 22, b.y + 38, aim + i * .16, 220, 7, "#ffe15f");
          }
        }
        if (b.altClock <= 0) {
          b.altClock = pattern === 2 ? 1.55 : 2.35;
          if (pattern === 0) {
            [-.55, -.25, .25, .55].forEach(a => enemyBullet(b.x, b.y + 30, Math.PI / 2 + a, 210, 7, "#ff6a76"));
          } else if (pattern === 1) {
            for (let i = 0; i < 5; i++) spawnEnemy("drone", 38 + i * 94, -40 - i * 18);
          } else {
            for (let i = 0; i < 14; i++) enemyBullet(b.x, b.y + 12, Math.PI * 2 * i / 14 - b.t, 150, 5, "#45f2a1");
          }
        }
      }

      function enemyBullet(x, y, angle, speed, r, color) {
        state.enemyBullets.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r,
          color,
          life: 5
        });
      }

      function updateEnemies(dt) {
        state.enemies.forEach(e => {
          e.t += dt;
          if (e.type === "scout") {
            e.y += e.speed * dt;
            e.x = e.baseX + Math.sin(e.t * 3.3) * 35;
          } else if (e.type === "striker") {
            e.y += e.speed * dt;
            e.x = e.baseX + Math.sin(e.t * 2.1) * 70;
          } else if (e.type === "tank") {
            e.y += e.speed * dt;
            e.x = e.baseX + Math.sin(e.t * 1.25) * 22;
          } else {
            const side = e.baseX < 0 ? 1 : -1;
            e.x += side * e.speed * 1.2 * dt;
            e.y += e.speed * .72 * dt;
          }
          e.x = clamp(e.x, -40, W + 40);
          e.fireClock -= dt;
          if (e.y > 8 && e.y < H - 140 && e.fireClock <= 0) {
            e.fireClock = e.fireRate;
            fireEnemy(e);
          }
        });
        state.enemies = state.enemies.filter(e => e.y < H + 70 && e.x > -80 && e.x < W + 80 && e.hp > 0);

        const b = state.boss;
        if (!b) return;
        b.t += dt;
        if (b.y < b.targetY) b.y += 70 * dt;
        const pattern = state.bossPattern;
        if (pattern === 0) {
          b.x = W / 2 + Math.sin(b.t * 1.15) * 112;
        } else if (pattern === 1) {
          b.x = W / 2 + Math.sin(b.t * 1.8) * 132;
          b.y = b.targetY + Math.sin(b.t * 2.5) * 18;
        } else {
          b.x = W / 2 + Math.sin(b.t * .85) * 95 + Math.sin(b.t * 2.1) * 34;
        }
        fireBoss(b, dt);
      }

      function updateProjectiles(dt) {
        state.bullets.forEach(b => {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
        });
        state.enemyBullets.forEach(b => {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
        });
        state.bullets = state.bullets.filter(b => b.life > 0 && b.y > -60 && b.y < H + 40 && b.x > -50 && b.x < W + 50);
        state.enemyBullets = state.enemyBullets.filter(b => b.life > 0 && b.y > -60 && b.y < H + 70 && b.x > -70 && b.x < W + 70);
      }

      function updatePowerups(dt) {
        const p = state.player;
        state.powerups.forEach(pow => {
          const magnet = p.powers.magnet > 0;
          if (magnet && dist2(pow, p) < 220 * 220) {
            const a = Math.atan2(p.y - pow.y, p.x - pow.x);
            pow.vx += Math.cos(a) * 620 * dt;
            pow.vy += Math.sin(a) * 620 * dt;
          }
          pow.x += pow.vx * dt;
          pow.y += pow.vy * dt;
          pow.vx *= .985;
          pow.vy += 18 * dt;
          pow.t += dt;
        });
        state.powerups = state.powerups.filter(pow => pow.y < H + 45 && !pow.dead);
      }

      function updateParticles(dt) {
        state.particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= .98;
          p.vy *= .98;
          p.life -= dt;
          p.age += dt;
        });
        state.particles = state.particles.filter(p => p.life > 0);
      }

      function updateStars(dt) {
        const speedBoost = state.phase === "clear" ? 2.5 : 1;
        state.stars.forEach(s => {
          s.y += s.v * speedBoost * dt;
          if (s.y > H + 4) {
            s.y = -4;
            s.x = rand(0, W);
            s.v = rand(26, 96);
          }
        });
      }

      function collisions() {
        const p = state.player;
        const targets = state.boss ? state.enemies.concat(state.boss) : state.enemies;

        state.bullets.forEach(b => {
          if (b.dead) return;
          for (const e of targets) {
            if (!e || e.hp <= 0) continue;
            const radius = e.r + b.r;
            if (dist2(b, e) <= radius * radius) {
              e.hp -= b.damage;
              spark(b.x, b.y, b.color, 3);
              if (b.kind !== "laser") b.dead = true;
              if (e.hp <= 0 && e.type !== "boss") destroyEnemy(e);
              break;
            }
          }
        });
        state.bullets = state.bullets.filter(b => !b.dead);

        state.enemyBullets.forEach(b => {
          if (b.dead || p.invuln > 0) return;
          const radius = p.r + b.r;
          if (dist2(b, p) <= radius * radius) {
            b.dead = true;
            hitPlayer();
          }
        });
        state.enemyBullets = state.enemyBullets.filter(b => !b.dead);

        state.enemies.forEach(e => {
          if (e.hp <= 0) return;
          if (p.invuln <= 0 && dist2(e, p) <= (p.r + e.r * .72) ** 2) {
            e.hp = 0;
            destroyEnemy(e, false);
            hitPlayer();
          }
        });

        state.powerups.forEach(pow => {
          if (dist2(pow, p) <= (p.bodyR + pow.r) ** 2) {
            pow.dead = true;
            applyPower(pow.kind);
          }
        });

        if (state.boss && state.boss.hp <= 0) {
          destroyBoss();
        }
        state.enemies = state.enemies.filter(e => e.hp > 0);
      }

      function destroyEnemy(e, reward = true) {
        burst(e.x, e.y, e.color, e.type === "tank" ? 30 : 18);
        if (reward) {
          addScore(e.score);
          state.combo = clamp(state.combo + 1, 1, 99);
          state.comboTimer = 3.4;
          if (chance(e.type === "tank" ? .32 : .17)) dropPower(e.x, e.y);
        }
        state.screenShake = Math.max(state.screenShake, e.type === "tank" ? .18 : .08);
      }

      function destroyBoss() {
        const b = state.boss;
        burst(b.x, b.y, b.color, 88);
        addScore(b.score);
        state.combo = clamp(state.combo + 8, 1, 99);
        dropPower(b.x - 35, b.y + 20, "bomb");
        dropPower(b.x + 35, b.y + 20);
        state.flash = .35;
        state.screenShake = .55;
        clearLevel();
      }

      function hitPlayer() {
        const p = state.player;
        if (p.shield > 0 || p.powers.shield > 0) {
          p.shield = 0;
          delete p.powers.shield;
          p.invuln = .6;
          burst(p.x, p.y, "#45f2a1", 22);
          vibrate(20);
          return;
        }
        p.hp -= 1;
        p.invuln = 1.45;
        state.combo = 1;
        burst(p.x, p.y, "#ff6a76", 34);
        state.screenShake = .38;
        vibrate([30, 40, 30]);
        if (p.hp <= 0) {
          if (p.lives > 0) {
            p.lives -= 1;
            p.hp = p.maxHp;
            p.x = W / 2;
            p.y = H - 118;
            p.invuln = 2;
            state.enemyBullets.length = 0;
          } else {
            gameOver();
          }
        }
      }

      function applyPower(kind) {
        const p = state.player;
        if (kind === "bomb") {
          p.bombs = clamp(p.bombs + 1, 0, 5);
        } else if (kind === "shield") {
          p.shield = powerDefs.shield.duration;
          p.powers.shield = powerDefs.shield.duration;
        } else {
          p.powers[kind] = powerDefs[kind].duration;
        }
        toast(t(`power.${kind}`));
        spark(p.x, p.y, powerDefs[kind].color, 20);
        vibrate(18);
      }

      function useBomb() {
        if (state.mode !== "playing" || !state.player || state.player.bombs <= 0) return;
        state.player.bombs -= 1;
        state.enemyBullets.length = 0;
        state.enemies.forEach(e => {
          e.hp -= 120 + state.level * 12;
          if (e.hp <= 0) destroyEnemy(e);
        });
        if (state.boss) state.boss.hp -= 160 + state.level * 22;
        state.flash = .42;
        state.screenShake = .48;
        burst(W / 2, H / 2, "#ffe15f", 90);
        vibrate([25, 35, 25]);
      }

      function dropPower(x, y, forced) {
        const kinds = ["spread", "laser", "rapid", "shield", "magnet", "bomb"];
        const kind = forced || kinds[Math.floor(Math.random() * kinds.length)];
        state.powerups.push({
          kind,
          x,
          y,
          vx: rand(-28, 28),
          vy: rand(44, 72),
          r: 14,
          t: 0,
          color: powerDefs[kind].color
        });
      }

      function burst(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          spark(x, y, color, 1, rand(70, 310));
        }
      }

      function spark(x, y, color, count, speed = 140) {
        for (let i = 0; i < count; i++) {
          const a = rand(0, Math.PI * 2);
          const v = rand(speed * .35, speed);
          state.particles.push({
            x,
            y,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            r: rand(1.6, 4.8),
            life: rand(.25, .85),
            age: 0,
            color
          });
        }
      }

      function update(dt) {
        updateStars(dt);
        if (state.mode !== "playing") {
          updateParticles(dt);
          return;
        }
        state.elapsed += dt;
        state.screenShake = Math.max(0, state.screenShake - dt);
        state.flash = Math.max(0, state.flash - dt);
        state.toastClock = Math.max(0, state.toastClock - dt);
        if (state.toastClock <= 0) ui.toast.classList.remove("visible");
        updatePlayer(dt);
        if (state.phase === "wave") spawnWave(dt);
        if (state.phase === "clear") nextLevel(dt);
        updateEnemies(dt);
        updateProjectiles(dt);
        updatePowerups(dt);
        collisions();
        updateParticles(dt);
        updateHud();
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#071733");
        grad.addColorStop(.52, "#121746");
        grad.addColorStop(1, "#1b0732");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = .36;
        ctx.strokeStyle = "#20d9ff";
        ctx.lineWidth = 1;
        const offset = (state.elapsed * 56) % 48;
        for (let y = -48 + offset; y < H; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y + 18);
          ctx.stroke();
        }
        ctx.restore();

        state.stars.forEach(s => {
          ctx.fillStyle = s.hue;
          ctx.globalAlpha = clamp(s.s / 2.7, .35, .95);
          ctx.fillRect(s.x, s.y, s.s, s.s * 3.2);
        });
        ctx.globalAlpha = 1;
      }

      function drawPlayer() {
        const p = state.player;
        if (!p) return;
        const flicker = p.invuln > 0 && Math.floor(p.invuln * 16) % 2 === 0;
        if (flicker) ctx.globalAlpha = .45;
        ctx.save();
        ctx.translate(p.x, p.y);
        const shieldActive = p.shield > 0 || p.powers.shield > 0;
        if (shieldActive) {
          ctx.strokeStyle = "rgba(69, 242, 161, .78)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 32 + Math.sin(state.elapsed * 9) * 2, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.shadowColor = "#20d9ff";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#dffbff";
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(18, 22);
        ctx.lineTo(0, 12);
        ctx.lineTo(-18, 22);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#20d9ff";
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(8, 14);
        ctx.lineTo(0, 8);
        ctx.lineTo(-8, 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff3fb4";
        ctx.globalAlpha = .85;
        ctx.beginPath();
        ctx.moveTo(-9, 21);
        ctx.lineTo(0, 36 + Math.sin(state.elapsed * 24) * 6);
        ctx.lineTo(9, 21);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ff5c6c";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      function drawEnemy(e) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 16;
        ctx.fillStyle = e.color;
        if (e.type === "scout") {
          ctx.beginPath();
          ctx.moveTo(0, 18);
          ctx.lineTo(16, -12);
          ctx.lineTo(0, -4);
          ctx.lineTo(-16, -12);
          ctx.closePath();
          ctx.fill();
        } else if (e.type === "striker") {
          ctx.rotate(Math.sin(e.t * 2) * .08);
          ctx.fillRect(-19, -10, 38, 20);
          ctx.fillRect(-7, -21, 14, 42);
        } else if (e.type === "tank") {
          ctx.beginPath();
          ctx.roundRect(-26, -20, 52, 40, 8);
          ctx.fill();
          ctx.fillStyle = "#fff4";
          ctx.fillRect(-18, -6, 36, 12);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-23, 0);
          ctx.lineTo(23, 0);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.fillRect(-e.r, e.r + 6, e.r * 2 * clamp(e.hp / e.maxHp, 0, 1), 3);
        ctx.restore();
      }

      function drawBoss(b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 24;
        ctx.fillStyle = b.color;
        if (state.bossPattern === 0) {
          ctx.beginPath();
          ctx.moveTo(0, -54);
          ctx.lineTo(62, 8);
          ctx.lineTo(28, 48);
          ctx.lineTo(0, 30);
          ctx.lineTo(-28, 48);
          ctx.lineTo(-62, 8);
          ctx.closePath();
          ctx.fill();
        } else if (state.bossPattern === 1) {
          for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, -58);
            ctx.lineTo(18, -14);
            ctx.lineTo(0, -4);
            ctx.lineTo(-18, -14);
            ctx.closePath();
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(0, 0, 28, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, 46, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(0, 0, 62, state.elapsed * 2, state.elapsed * 2 + Math.PI * 1.2);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.beginPath();
        ctx.arc(0, 0, 16 + Math.sin(state.elapsed * 8) * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawProjectiles() {
        state.bullets.forEach(b => {
          ctx.save();
          ctx.shadowColor = b.color;
          ctx.shadowBlur = b.kind === "laser" ? 20 : 10;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x - b.r * .55, b.y - b.r * 2.6, b.r * 1.1, b.r * 4.2, b.r);
          ctx.fill();
          ctx.restore();
        });
        state.enemyBullets.forEach(b => {
          ctx.save();
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 13;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff8";
          ctx.beginPath();
          ctx.arc(b.x - b.r * .25, b.y - b.r * .25, b.r * .35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      function drawPowerups() {
        state.powerups.forEach(pow => {
          ctx.save();
          ctx.translate(pow.x, pow.y);
          ctx.rotate(pow.t * 2.4);
          ctx.shadowColor = pow.color;
          ctx.shadowBlur = 18;
          ctx.fillStyle = pow.color;
          ctx.beginPath();
          ctx.roundRect(-14, -14, 28, 28, 7);
          ctx.fill();
          ctx.fillStyle = "#07122b";
          ctx.font = "900 13px system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(t(`power.${pow.kind}`).slice(0, 1), 0, 1);
          ctx.restore();
        });
      }

      function drawParticles() {
        state.particles.forEach(p => {
          const a = clamp(p.life / Math.max(.01, p.life + p.age), 0, 1);
          ctx.globalAlpha = a;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      function draw() {
        ctx.save();
        const shake = state.screenShake > 0 ? state.screenShake * 12 : 0;
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
        drawBackground();
        state.powerups.length && drawPowerups();
        state.enemies.forEach(drawEnemy);
        if (state.boss) drawBoss(state.boss);
        drawProjectiles();
        drawPlayer();
        drawParticles();
        if (state.flash > 0) {
          ctx.globalAlpha = clamp(state.flash * 2.5, 0, .55);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function loop(now) {
        const dt = clamp((now - state.lastTime) / 1000 || 0, 0, .033);
        state.lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function eventPoint(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (evt.clientX - rect.left) / rect.width * W,
          y: (evt.clientY - rect.top) / rect.height * H
        };
      }

      function pointerDown(evt) {
        if (state.mode !== "playing" || state.pointer.active) return;
        const point = eventPoint(evt);
        state.pointer.active = true;
        state.pointer.id = evt.pointerId;
        state.pointer.startX = point.x;
        state.pointer.startY = point.y;
        state.pointer.baseX = state.player.x;
        state.pointer.baseY = state.player.y;
        canvas.setPointerCapture(evt.pointerId);
      }

      function pointerMove(evt) {
        if (!state.pointer.active || evt.pointerId !== state.pointer.id || state.mode !== "playing") return;
        const point = eventPoint(evt);
        const dx = point.x - state.pointer.startX;
        const dy = point.y - state.pointer.startY;
        state.player.x = clamp(state.pointer.baseX + dx, 25, W - 25);
        state.player.y = clamp(state.pointer.baseY + dy, 78, H - 38);
      }

      function pointerUp(evt) {
        if (evt.pointerId !== state.pointer.id) return;
        state.pointer.active = false;
        state.pointer.id = null;
      }

      function bindEvents() {
        document.getElementById("startBtn").addEventListener("click", resetGame);
        document.getElementById("restartBtn").addEventListener("click", resetGame);
        document.getElementById("resumeBtn").addEventListener("click", resumeGame);
        document.getElementById("pauseBtn").addEventListener("click", () => state.mode === "paused" ? resumeGame() : showPause());
        document.getElementById("quitBtn").addEventListener("click", showMenu);
        document.getElementById("menuBtn").addEventListener("click", showMenu);
        document.getElementById("bombBtn").addEventListener("click", useBomb);
        document.getElementById("howBtn").addEventListener("click", () => toast(t("explain")));
        ui.langBtn.addEventListener("click", () => setLanguage(state.lang === "zh" ? "en" : "zh"));
        canvas.addEventListener("pointerdown", pointerDown);
        canvas.addEventListener("pointermove", pointerMove);
        canvas.addEventListener("pointerup", pointerUp);
        canvas.addEventListener("pointercancel", pointerUp);
        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("blur", () => {
          if (state.mode === "playing") showPause();
        });
        window.addEventListener("keydown", evt => {
          state.keys.add(evt.code);
          if (evt.code === "Space") useBomb();
          if (evt.code === "Escape") state.mode === "paused" ? resumeGame() : showPause();
        });
        window.addEventListener("keyup", evt => state.keys.delete(evt.code));
      }

      function boot() {
        resizeCanvas();
        seedStars();
        bindEvents();
        setLanguage(state.lang);
        showMenu();
        state.lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      boot();
    })();
  </script>
</body>
</html>
