<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟雨江南 - 水墨江南</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', serif;
            overflow-x: hidden;
            background: linear-gradient(180deg, #d4d8dc 0%, #a8b0b8 50%, #6b7680 100%);
            min-height: 100vh;
        }

        /* 雨滴容器 */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(174,198,235,0.6) 50%, rgba(255,255,255,0.8) 100%);
            animation: fall linear infinite;
            border-radius: 2px;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(10deg);
                opacity: 0;
            }
        }

        /* 水面涟漪 */
        .ripple {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: rippleExpand 1.5s ease-out forwards;
        }

        @keyframes rippleExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 0.5rem;
            margin-bottom: 20px;
            font-weight: 300;
            position: relative;
            z-index: 10;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #5a6c7d;
            letter-spacing: 0.3rem;
            font-weight: 300;
            position: relative;
            z-index: 10;
        }

        /* 装饰线条 */
        .deco-line {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5a6c7d, transparent);
            margin: 20px auto;
        }

        /* 江南水墨画区域 */
        .ink-painting {
            position: relative;
            width: 100%;
            height: clamp(300px, 50vh, 500px);
            margin: 40px 0;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(180deg, 
                rgba(200,210,220,0.8) 0%, 
                rgba(150,170,180,0.6) 40%,
                rgba(100,120,140,0.4) 70%,
                rgba(80,100,120,0.3) 100%);
        }

        /* 远山 */
        .mountain {
            position: absolute;
            bottom: 30%;
            width: 0;
            height: 0;
            border-left: transparent solid;
            border-right: transparent solid;
            border-bottom: solid;
            filter: blur(2px);
        }

        .mountain-1 {
            left: -10%;
            border-left-width: 150px;
            border-right-width: 150px;
            border-bottom-width: 200px;
            border-bottom-color: rgba(60,80,90,0.3);
        }

        .mountain-2 {
            left: 15%;
            border-left-width: 200px;
            border-right-width: 200px;
            border-bottom-width: 250px;
            border-bottom-color: rgba(50,70,80,0.4);
        }

        .mountain-3 {
            right: -5%;
            border-left-width: 180px;
            border-right-width: 180px;
            border-bottom-width: 220px;
            border-bottom-color: rgba(60,80,90,0.35);
        }

        .mountain-4 {
            right: 20%;
            border-left-width: 160px;
            border-right-width: 160px;
            border-bottom-width: 180px;
            border-bottom-color: rgba(45,65,75,0.3);
        }

        /* 水面 */
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg,
                rgba(100,130,150,0.3) 0%,
                rgba(70,100,120,0.5) 100%);
        }

        /* 小船 */
        .boat {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            animation: boatFloat 4s ease-in-out infinite;
        }

        .boat-body {
            width: 80px;
            height: 20px;
            background: linear-gradient(180deg, #4a3728 0%, #2d2118 100%);
            border-radius: 0 0 40px 40px;
            position: relative;
        }

        .boat-cover {
            position: absolute;
            top: -25px;
            left: 10px;
            width: 60px;
            height: 30px;
            background: linear-gradient(180deg, #6b5344 0%, #4a3728 100%);
            border-radius: 30px 30px 0 0;
        }

        .boat-person {
            position: absolute;
            top: -15px;
            right: 15px;
            width: 8px;
            height: 15px;
            background: #2c3e50;
            border-radius: 50% 50% 0 0;
        }

        @keyframes boatFloat {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        /* 油纸伞 */
        .umbrella-container {
            position: absolute;
            top: 20%;
            right: 15%;
            animation: umbrellaFloat 3s ease-in-out infinite;
        }

        @keyframes umbrellaFloat {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-10px) rotate(-3deg);
            }
        }

        .umbrella {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .umbrella-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: linear-gradient(180deg, #c44536 0%, #a3352a 50%, #8b2820 100%);
            border-radius: 100px 100px 0 0;
            overflow: hidden;
        }

        .umbrella-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.1) 10px,
                rgba(0,0,0,0.1) 11px
            );
        }

        .umbrella-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: linear-gradient(180deg, #a3352a 0%, #8b2820 100%);
            border-radius: 0 0 55px 55px;
        }

        .umbrella-handle {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 45px;
            background: linear-gradient(90deg, #4a3728 0%, #6b5344 50%, #4a3728 100%);
            border-radius: 3px;
        }

        .umbrella-hook {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            border: 4px solid #4a3728;
            border-top: none;
            border-radius: 0 0 20px 20px;
        }

        /* 古建筑剪影 */
        .building {
            position: absolute;
            bottom: 30%;
            left: 5%;
        }

        .building-roof {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 40px solid rgba(40,50,60,0.6);
            position: relative;
        }

        .building-roof::after {
            content: '';
            position: absolute;
            top: 40px;
            left: -70px;
            width: 140px;
            height: 8px;
            background: rgba(40,50,60,0.6);
            transform: skewX(-10deg);
        }

        .building-body {
            width: 80px;
            height: 60px;
            background: rgba(40,50,60,0.5);
            margin: 0 auto;
            position: relative;
        }

        .building-window {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background: rgba(200,180,150,0.3);
            border: 2px solid rgba(40,50,60,0.6);
        }

        .building-window::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(40,50,60,0.6);
            transform: translateY(-50%);
        }

        .building-window::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(40,50,60,0.6);
            transform: translateX(-50%);
        }

        /* 内容区域 */
        .content-section {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            margin: 40px 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 0.2rem;
            position: relative;
        }

        .section-title::after {
            content: '◆';
            display: block;
            color: #c44536;
            font-size: 1rem;
            margin-top: 10px;
        }

        .poem {
            text-align: center;
            line-height: 2.5;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #34495e;
        }

        .poem-line {
            margin: 10px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: poemFadeIn 1s ease forwards;
        }

        .poem-line:nth-child(1) { animation-delay: 0.2s; }
        .poem-line:nth-child(2) { animation-delay: 0.4s; }
        .poem-line:nth-child(3) { animation-delay: 0.6s; }
        .poem-line:nth-child(4) { animation-delay: 0.8s; }

        @keyframes poemFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .description {
            text-align: center;
            line-height: 2;
            color: #5a6c7d;
            font-size: clamp(0.9rem, 2vw, 1rem);
            margin-top: 30px;
        }

        /* 特色卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .feature-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(240,245,250,0.8) 100%);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(100,120,140,0.2);
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 12px;
            letter-spacing: 0.1rem;
        }

        .feature-text {
            color: #5a6c7d;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #5a6c7d;
            font-size: 0.9rem;
        }

        .footer-deco {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5a6c7d, transparent);
            margin: 20px auto;
        }

        /* 飘落花瓣 */
        .petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ffb7c5 0%, #ff9eb5 100%);
            border-radius: 10px 0 10px 0;
            animation: petalFall linear infinite;
            opacity: 0.8;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10px) rotate(0deg) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) translateX(50px);
                opacity: 0;
            }
        }

        /* 雾气效果 */
        .fog {
            position: absolute;
            bottom: 25%;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(200,210,220,0.4) 50%,
                rgba(200,210,220,0.6) 100%);
            filter: blur(20px);
            animation: fogMove 8s ease-in-out infinite;
        }

        @keyframes fogMove {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.8;
            }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .content-section {
                padding: 25px 20px;
            }

            .umbrella-container {
                right: 5%;
                top: 15%;
            }

            .umbrella {
                transform: scale(0.8);
            }

            .building {
                left: 2%;
                transform: scale(0.8);
                transform-origin: left bottom;
            }

            .boat {
                transform: translateX(-50%) scale(0.8);
            }

            .features {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .ink-painting {
                height: 250px;
            }

            .mountain-1, .mountain-3 {
                display: none;
            }
        }

        /* 灯笼装饰 */
        .lantern {
            position: absolute;
            top: 10px;
            width: 30px;
            height: 40px;
            background: linear-gradient(180deg, #c44536 0%, #a3352a 100%);
            border-radius: 5px 5px 10px 10px;
            animation: lanternSway 3s ease-in-out infinite;
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: #4a3728;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: #c44536;
        }

        .lantern-1 {
            left: 10%;
            animation-delay: 0s;
        }

        .lantern-2 {
            right: 10%;
            animation-delay: 1.5s;
        }

        @keyframes lanternSway {
            0%, 100% {
                transform: rotate(-3deg);
            }
            50% {
                transform: rotate(3deg);
            }
        }
    </style>
</head>
<body>
    <!-- 雨滴容器 -->
    <div class="rain-container" id="rainContainer"></div>

    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="lantern lantern-1"></div>
            <div class="lantern lantern-2"></div>
            <h1 class="title">烟雨江南</h1>
            <div class="deco-line"></div>
            <p class="subtitle">水墨丹青 · 梦里水乡</p>
        </header>

        <!-- 水墨画区域 -->
        <div class="ink-painting">
            <!-- 远山 -->
            <div class="mountain mountain-1"></div>
            <div class="mountain mountain-2"></div>
            <div class="mountain mountain-3"></div>
            <div class="mountain mountain-4"></div>
            
            <!-- 古建筑 -->
            <div class="building">
                <div class="building-roof"></div>
                <div class="building-body">
                    <div class="building-window"></div>
                </div>
            </div>

            <!-- 油纸伞 -->
            <div class="umbrella-container">
                <div class="umbrella">
                    <div class="umbrella-top"></div>
                    <div class="umbrella-bottom"></div>
                    <div class="umbrella-handle"></div>
                    <div class="umbrella-hook"></div>
                </div>
            </div>

            <!-- 水面 -->
            <div class="water"></div>
            
            <!-- 雾气 -->
            <div class="fog"></div>

            <!-- 小船 -->
            <div class="boat">
                <div class="boat-body">
                    <div class="boat-cover"></div>
                    <div class="boat-person"></div>
                </div>
            </div>
        </div>

        <!-- 诗词内容 -->
        <section class="content-section">
            <h2 class="section-title">江南春</h2>
            <div class="poem">
                <p class="poem-line">千里莺啼绿映红，</p>
                <p class="poem-line">水村山郭酒旗风。</p>
                <p class="poem-line">南朝四百八十寺，</p>
                <p class="poem-line">多少楼台烟雨中。</p>
            </div>
            <p class="description">
                江南，一个如诗如画的地方。细雨如丝，轻抚着青石板路；<br>
                小桥流水，倒映着白墙黛瓦。撑一把油纸伞，漫步在烟雨朦胧的巷弄，<br>
                仿佛穿越了千年的时光，遇见最美的江南。
            </p>

            <!-- 特色卡片 -->
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">🏮</div>
                    <h3 class="feature-title">古镇风情</h3>
                    <p class="feature-text">青砖黛瓦马头墙，回廊挂落花格窗。千年古镇，诉说着岁月的故事。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🛶</div>
                    <h3 class="feature-title">小桥流水</h3>
                    <p class="feature-text">君到姑苏见，人家尽枕河。古宫闲地少，水港小桥多。</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">☂️</div>
                    <h3 class="feature-title">油纸伞韵</h3>
                    <p class="feature-text">撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷。</p>
                </div>
            </div>
        </section>

        <!-- 页脚 -->
        <footer>
            <div class="footer-deco"></div>
            <p>烟雨江南 · 水墨丹青</p>
            <p style="margin-top: 10px; opacity: 0.7;">一蓑烟雨任平生</p>
        </footer>
    </div>

    <script>
        // 创建雨滴
        function createRaindrop() {
            const container = document.getElementById('rainContainer');
            const raindrop = document.createElement('div');
            raindrop.className = 'raindrop';
            raindrop.style.left = Math.random() * 100 + '%';
            raindrop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
            raindrop.style.animationDelay = Math.random() * 2 + 's';
            raindrop.style.opacity = 0.3 + Math.random() * 0.5;
            container.appendChild(raindrop);

            // 移除雨滴
            setTimeout(() => {
                raindrop.remove();
            }, 3000);
        }

        // 创建涟漪
        function createRipple(x, y) {
            const container = document.getElementById('rainContainer');
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            container.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 1500);
        }

        // 创建花瓣
        function createPetal() {
            const container = document.getElementById('rainContainer');
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (5 + Math.random() * 5) + 's';
            petal.style.animationDelay = Math.random() * 3 + 's';
            container.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 10000);
        }

        // 初始化雨滴
        function initRain() {
            const rainCount = window.innerWidth < 768 ? 50 : 100;
            for (let i = 0; i < rainCount; i++) {
                setTimeout(createRaindrop, Math.random() * 2000);
            }
        }

        // 初始化花瓣
        function initPetals() {
            const petalCount = window.innerWidth < 768 ? 5 : 10;
            for (let i = 0; i < petalCount; i++) {
                setTimeout(createPetal, Math.random() * 5000);
            }
        }

        // 点击水面创建涟漪
        document.querySelector('.water').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            createRipple(e.clientX - rect.left, e.clientY - rect.top);
        });

        // 页面加载完成
        window.addEventListener('load', function() {
            initRain();
            initPetals();

            // 持续创建雨滴
            setInterval(createRaindrop, 100);
            
            // 持续创建花瓣
            setInterval(createPetal, 2000);
        });

        // 窗口大小改变时调整
        window.addEventListener('resize', function() {
            const container = document.getElementById('rainContainer');
            container.innerHTML = '';
            initRain();
        });
    </script>
</body>
</html>
