<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yyfollower Blog Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 2rem;
    }
    
    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    
    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-left: 1.75rem;
    }
    
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }
    
    svg {
      width: 100%;
      min-width: 800px;
      display: block;
    }
    
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #475569;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>yyfollower Blog Architecture</h1>
      </div>
      <p class="subtitle">Flask + Nginx + PostgreSQL on Tencent Cloud</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 800 400">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <rect x="30" y="170" width="100" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="80" y="190" fill="white" font-size="11" font-weight="600" text-anchor="middle">Visitors</text>
        <text x="80" y="206" fill="#94a3b8" font-size="9" text-anchor="middle">Browser</text>

        <rect x="170" y="40" width="580" height="320" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="182" y="58" fill="#fbbf24" font-size="10" font-weight="600">Tencent Cloud Server (124.222.73.150)</text>

        <rect x="200" y="170" width="110" height="50" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="255" y="190" fill="white" font-size="11" font-weight="600" text-anchor="middle">Nginx</text>
        <text x="255" y="206" fill="#94a3b8" font-size="9" text-anchor="middle">Port 80/443</text>

        <rect x="360" y="100" width="110" height="50" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="415" y="120" fill="white" font-size="11" font-weight="600" text-anchor="middle">Static Pages</text>
        <text x="415" y="136" fill="#94a3b8" font-size="9" text-anchor="middle">/var/www/static</text>

        <rect x="360" y="170" width="110" height="50" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="415" y="190" fill="white" font-size="11" font-weight="600" text-anchor="middle">Flask Backend</text>
        <text x="415" y="206" fill="#94a3b8" font-size="9" text-anchor="middle">Port 8080</text>

        <rect x="360" y="240" width="110" height="50" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="415" y="260" fill="white" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
        <text x="415" y="276" fill="#94a3b8" font-size="9" text-anchor="middle">Blog Data</text>

        <line x1="130" y1="195" x2="198" y2="195" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="164" y="189" fill="#94a3b8" font-size="9" text-anchor="middle">HTTPS</text>

        <line x1="310" y1="175" x2="358" y2="120" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="330" y="140" fill="#94a3b8" font-size="9">Static</text>

        <line x1="310" y1="195" x2="358" y2="195" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="330" y="189" fill="#94a3b8" font-size="9">API</text>

        <line x1="415" y1="220" x2="415" y2="238" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      </svg>
    </div>

    <p class="footer">
      yyfollower.com • ICP备案 浙ICP备2023004975号
    </p>
  </div>
</body>
</html>
