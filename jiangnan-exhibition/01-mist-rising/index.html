<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>烟雨初起</title>
  <style>
    :root {
      --ink: #1f2b2c;
      --ink-soft: #536567;
      --mist: #dce5e3;
      --pale: #eef3f1;
      --cyan: #b9d4d1;
      --water: #c8d9d8;
      --paper: #f5f6f2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: clip;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: clip;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 26rem),
        linear-gradient(180deg, #eef3f0 0%, #dce9e6 38%, #c9dcda 66%, #b7cecd 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      content: "";
      opacity: .34;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(circle at 18% 24%, rgba(50, 65, 65, .09) 0 1px, transparent 1.4px),
        radial-gradient(circle at 73% 63%, rgba(50, 65, 65, .07) 0 1px, transparent 1.5px),
        linear-gradient(100deg, transparent 0 46%, rgba(77, 94, 91, .07) 48%, transparent 50% 100%);
      background-size: 64px 58px, 91px 77px, 220px 100%;
    }

    .scene {
      position: relative;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 8;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sky-wash {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 52% 18%, rgba(255, 255, 255, .72), rgba(255, 255, 255, 0) 28%),
        radial-gradient(ellipse at 75% 34%, rgba(176, 203, 201, .6), rgba(176, 203, 201, 0) 34%),
        linear-gradient(180deg, rgba(245, 247, 243, .92), rgba(224, 235, 233, .72) 42%, rgba(189, 211, 210, .7));
    }

    .mountains {
      position: absolute;
      inset: auto 0 31%;
      z-index: 1;
      height: 45%;
      opacity: .78;
      filter: blur(.1px);
    }

    .mountain {
      position: absolute;
      bottom: 0;
      width: 78%;
      height: 82%;
      transform-origin: bottom center;
      background: linear-gradient(180deg, rgba(88, 108, 108, .17), rgba(52, 70, 71, .3));
      clip-path: polygon(0 100%, 10% 74%, 20% 58%, 28% 66%, 39% 32%, 48% 48%, 58% 20%, 70% 58%, 81% 43%, 92% 76%, 100% 100%);
    }

    .mountain.back {
      left: -12%;
      height: 76%;
      opacity: .43;
      transform: scaleX(1.08);
      background: linear-gradient(180deg, rgba(119, 141, 140, .13), rgba(70, 91, 91, .2));
      filter: blur(6px);
    }

    .mountain.mid {
      left: 18%;
      bottom: -6%;
      opacity: .45;
      transform: scaleX(1.14);
      filter: blur(3px);
    }

    .mountain.front {
      right: -16%;
      bottom: -9%;
      height: 66%;
      opacity: .34;
      transform: scaleX(1.04);
      filter: blur(4px);
    }

    .shore {
      position: absolute;
      right: 0;
      bottom: 35%;
      left: 0;
      z-index: 3;
      height: 14%;
      opacity: .6;
      background:
        linear-gradient(90deg, transparent 0 9%, rgba(53, 72, 72, .14) 16%, transparent 28%),
        linear-gradient(90deg, transparent 0 44%, rgba(46, 63, 63, .18) 52%, transparent 67%),
        linear-gradient(180deg, transparent, rgba(66, 85, 84, .11));
      clip-path: polygon(0 76%, 9% 67%, 16% 72%, 27% 58%, 38% 71%, 47% 60%, 56% 68%, 68% 52%, 80% 65%, 90% 55%, 100% 63%, 100% 100%, 0 100%);
      filter: blur(2px);
    }

    .water {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      height: 43%;
      background:
        linear-gradient(180deg, rgba(218, 231, 229, .9), rgba(176, 202, 201, .92)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .13) 0 1px, transparent 1px 14px);
      overflow: hidden;
    }

    .water::before,
    .water::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        radial-gradient(ellipse at 24% 28%, rgba(61, 80, 80, .13), transparent 31%),
        radial-gradient(ellipse at 68% 52%, rgba(255, 255, 255, .28), transparent 24%),
        repeating-linear-gradient(178deg, rgba(42, 59, 60, .18) 0 1px, transparent 1px 20px);
      transform: translate3d(0, 0, 0);
      animation: drift 18s linear infinite;
    }

    .water::after {
      opacity: .42;
      transform: translateX(-8%);
      animation-duration: 28s;
      animation-direction: reverse;
      background:
        repeating-linear-gradient(182deg, rgba(255, 255, 255, .28) 0 1px, transparent 1px 24px),
        radial-gradient(ellipse at 52% 64%, rgba(34, 50, 51, .11), transparent 28%);
    }

    .mist {
      position: absolute;
      right: -15%;
      left: -15%;
      z-index: 4;
      height: 22%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 48%, rgba(248, 250, 247, .82), transparent 56%),
        radial-gradient(ellipse at 52% 42%, rgba(241, 248, 246, .76), transparent 48%),
        radial-gradient(ellipse at 82% 54%, rgba(239, 246, 244, .84), transparent 55%);
      filter: blur(12px);
      animation: mist-flow 24s ease-in-out infinite alternate;
    }

    .mist.one {
      bottom: 36%;
      opacity: .86;
    }

    .mist.two {
      bottom: 25%;
      height: 28%;
      opacity: .58;
      animation-duration: 32s;
      animation-direction: alternate-reverse;
    }

    .boat {
      position: absolute;
      right: 12%;
      bottom: 30%;
      z-index: 6;
      width: clamp(120px, 16vw, 230px);
      height: clamp(34px, 4.8vw, 64px);
      opacity: .64;
      transform: translate3d(0, 0, 0);
      animation: boat-drift 22s ease-in-out infinite alternate;
    }

    .boat::before {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 34%;
      content: "";
      border-radius: 0 0 80% 80% / 0 0 100% 100%;
      background: linear-gradient(90deg, transparent 0 5%, rgba(33, 48, 48, .56) 16%, rgba(19, 33, 34, .63) 60%, transparent 94%);
      clip-path: polygon(0 0, 100% 0, 83% 100%, 15% 100%);
      filter: blur(.2px);
    }

    .boat::after {
      position: absolute;
      bottom: 31%;
      left: 46%;
      width: 1px;
      height: 82%;
      content: "";
      background: rgba(28, 43, 44, .45);
      transform: rotate(-8deg);
      box-shadow: 34px 15px 0 rgba(28, 43, 44, .25);
    }

    .content {
      position: relative;
      z-index: 7;
      display: grid;
      min-height: 100svh;
      align-items: start;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(42px, 8vh, 88px) 0 32vh;
    }

    .title-block {
      width: min(520px, 100%);
    }

    .kicker {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
      color: rgba(44, 62, 63, .78);
      font-size: clamp(13px, 1.4vw, 16px);
      line-height: 1.5;
      letter-spacing: 0;
    }

    .kicker::before {
      width: 42px;
      height: 1px;
      content: "";
      background: rgba(51, 70, 71, .36);
    }

    h1 {
      margin: 0;
      color: rgba(24, 38, 39, .9);
      font-size: clamp(58px, 10vw, 132px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 12px 34px rgba(255, 255, 255, .62);
      writing-mode: vertical-rl;
    }

    .poem {
      position: absolute;
      top: clamp(120px, 22vh, 210px);
      right: clamp(4px, 4vw, 44px);
      display: grid;
      gap: 12px;
      max-height: 48vh;
      margin: 0;
      color: rgba(43, 61, 62, .76);
      font-size: clamp(15px, 1.7vw, 22px);
      line-height: 1.85;
      letter-spacing: 0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .seal {
      position: absolute;
      top: clamp(52px, 9vh, 92px);
      right: clamp(22px, 7vw, 110px);
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: rgba(110, 38, 37, .78);
      font-size: 14px;
      line-height: 1.05;
      border: 1px solid rgba(137, 52, 49, .46);
      background: rgba(245, 246, 241, .2);
      transform: rotate(3deg);
      writing-mode: vertical-rl;
    }

    .lower-panel {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 9;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 clamp(22px, 5vh, 48px);
      color: rgba(31, 43, 44, .74);
    }

    .caption {
      max-width: 560px;
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(13px, 1.2vw, 16px);
      line-height: 1.9;
      letter-spacing: 0;
    }

    .weather-mark {
      display: grid;
      gap: 7px;
      justify-items: end;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: rgba(32, 49, 50, .62);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .weather-mark i {
      display: block;
      width: 92px;
      height: 1px;
      background: rgba(40, 57, 58, .23);
    }

    .rain-lines {
      position: absolute;
      inset: -20% -10%;
      z-index: 6;
      opacity: .45;
      pointer-events: none;
      background-image:
        linear-gradient(105deg, transparent 0 43%, rgba(83, 105, 105, .18) 44%, transparent 45% 100%);
      background-size: 19px 68px;
      animation: rain-fall 1.6s linear infinite;
    }

    @keyframes drift {
      from {
        background-position: 0 0, 0 0, 0 0;
      }
      to {
        background-position: 180px 0, -120px 0, 260px 0;
      }
    }

    @keyframes mist-flow {
      from {
        transform: translateX(-3%) scale(1);
      }
      to {
        transform: translateX(3%) scale(1.04);
      }
    }

    @keyframes rain-fall {
      from {
        transform: translate3d(0, -22px, 0);
      }
      to {
        transform: translate3d(-18px, 48px, 0);
      }
    }

    @keyframes boat-drift {
      from {
        transform: translate3d(-18px, 0, 0);
      }
      to {
        transform: translate3d(24px, 5px, 0);
      }
    }

    @media (max-width: 760px) {
      .content {
        width: min(100% - 28px, 620px);
        padding-top: 34px;
        padding-bottom: 42vh;
      }

      h1 {
        font-size: clamp(54px, 18vw, 86px);
      }

      .poem {
        top: 120px;
        right: 10px;
        gap: 8px;
        max-height: 42vh;
        font-size: 15px;
      }

      .seal {
        top: 38px;
        right: 18px;
        width: 36px;
        height: 36px;
        font-size: 12px;
      }

      .boat {
        right: 4%;
        bottom: 32%;
        width: 132px;
      }

      .lower-panel {
        grid-template-columns: 1fr;
        width: min(100% - 28px, 620px);
        gap: 14px;
      }

      .weather-mark {
        justify-items: start;
      }

      .weather-mark i {
        width: 68px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="烟雨初起，江南清晨薄雾笼罩水面">
    <div class="sky-wash"></div>
    <div class="mountains" aria-hidden="true">
      <div class="mountain back"></div>
      <div class="mountain mid"></div>
      <div class="mountain front"></div>
    </div>
    <div class="shore" aria-hidden="true"></div>
    <div class="water" aria-hidden="true"></div>
    <div class="mist one" aria-hidden="true"></div>
    <div class="mist two" aria-hidden="true"></div>
    <div class="boat" aria-hidden="true"></div>
    <div class="rain-lines" aria-hidden="true"></div>
    <canvas id="rainCanvas" aria-hidden="true"></canvas>

    <section class="content">
      <div class="title-block">
        <p class="kicker">江南清晨</p>
        <h1>烟雨初起</h1>
      </div>
      <p class="poem">
        薄雾笼水<br>
        雨丝入岸<br>
        远山如墨<br>
        天地微青
      </p>
      <span class="seal">初雨</span>
    </section>

    <footer class="lower-panel">
      <p class="caption">
        晨光未满，水面先有清寒。浅灰与淡青在雾中相融，雨意从山影间落下，只留一江柔软的水墨氤氲。
      </p>
      <div class="weather-mark" aria-hidden="true">
        <span>mist over water</span>
        <i></i>
        <span>first rain</span>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("rainCanvas");
      const ctx = canvas.getContext("2d");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
      let drops = [];
      let ripples = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let frame = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth;
        height = canvas.clientHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(72, Math.floor(width * height / 14500));
        drops = Array.from({ length: count }, makeDrop);
        ripples = Array.from({ length: Math.floor(count / 5) }, makeRipple);
      }

      function makeDrop() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          len: 14 + Math.random() * 24,
          speed: 1.8 + Math.random() * 2.2,
          alpha: .08 + Math.random() * .16
        };
      }

      function makeRipple() {
        return {
          x: Math.random() * width,
          y: height * (.58 + Math.random() * .36),
          r: 4 + Math.random() * 36,
          speed: .16 + Math.random() * .32,
          alpha: .05 + Math.random() * .11
        };
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.lineCap = "round";

        for (const drop of drops) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(61, 82, 82, ${drop.alpha})`;
          ctx.lineWidth = .7;
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - drop.len * .38, drop.y + drop.len);
          ctx.stroke();
          drop.x -= drop.speed * .42;
          drop.y += drop.speed;
          if (drop.y > height + 40 || drop.x < -60) {
            Object.assign(drop, makeDrop(), { y: -30, x: Math.random() * width + 40 });
          }
        }

        for (const ripple of ripples) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(31, 54, 55, ${ripple.alpha * (1 - ripple.r / 60)})`;
          ctx.lineWidth = .8;
          ctx.ellipse(ripple.x, ripple.y, ripple.r * 1.9, ripple.r * .35, 0, 0, Math.PI * 2);
          ctx.stroke();
          ripple.r += ripple.speed;
          if (ripple.r > 58) {
            Object.assign(ripple, makeRipple(), { r: 3 });
          }
        }

        frame = requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener("resize", resize, { passive: true });
      if (!reduced.matches) {
        draw();
      }
    })();
  </script>

<script>
(function(){
  "use strict";
  function lock() {
    var h = window.innerHeight;
    document.documentElement.style.setProperty("height", h + "px", "important");
    document.documentElement.style.setProperty("overflow", "hidden", "important");
    document.body.style.setProperty("height", h + "px", "important");
    document.body.style.setProperty("overflow", "hidden", "important");
    window.scrollTo(0, 0);
  }
  lock();
  window.addEventListener("resize", lock);
  window.addEventListener("scroll", function(){ window.scrollTo(0, 0); }, {capture: true, passive: false});
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive: false});
})();
</script>
</body>
</html>
