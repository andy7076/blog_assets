<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白墙黛瓦 · 江南雨巷</title>
  <style>
    :root {
      --ink: #20272a;
      --tile: #283235;
      --tile-soft: #3d4b4e;
      --wall: #f3f0e6;
      --wall-shadow: #d8d4c8;
      --stone: #59666a;
      --stone-dark: #354247;
      --warm: #ffd980;
      --warm-deep: #d59643;
      --moss: #6f816d;
      --mist: #b7c5c5;
      --rain: rgba(217, 232, 231, .72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: "Songti SC", "SimSun", "Noto Serif SC", Georgia, serif;
      background:
        radial-gradient(circle at 72% 32%, rgba(255, 217, 128, .14), transparent 22rem),
        linear-gradient(180deg, #aebcbd 0%, #c4cecb 38%, #7f8d8d 100%);
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(42, 54, 57, .18), transparent 36%),
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 34%, rgba(32,39,42,.12));
    }

    .mist {
      position: absolute;
      inset: -10% -8%;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(243, 240, 230, .45), transparent 30%),
        radial-gradient(ellipse at 72% 12%, rgba(234, 238, 232, .32), transparent 28%),
        linear-gradient(180deg, rgba(232, 236, 230, .34), transparent 52%);
      filter: blur(2px);
      animation: mistDrift 18s ease-in-out infinite alternate;
    }

    .distant-roof {
      position: absolute;
      left: -4vw;
      right: -4vw;
      top: 17vh;
      z-index: 2;
      height: 18vh;
      opacity: .42;
      filter: blur(.6px);
    }

    .distant-roof::before,
    .distant-roof::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 72%;
      clip-path: polygon(0 72%, 12% 54%, 24% 64%, 37% 39%, 49% 59%, 63% 37%, 76% 58%, 88% 44%, 100% 68%, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(50, 63, 65, .9), rgba(35, 43, 45, .88));
    }

    .distant-roof::after {
      top: 34%;
      height: 58%;
      opacity: .65;
      background: linear-gradient(180deg, rgba(236, 234, 221, .8), rgba(201, 205, 198, .62));
      clip-path: polygon(0 32%, 16% 45%, 34% 36%, 48% 51%, 64% 36%, 82% 47%, 100% 34%, 100% 100%, 0 100%);
    }

    .moon-mark {
      position: absolute;
      top: 7vh;
      right: 12vw;
      z-index: 2;
      width: clamp(88px, 10vw, 148px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 244, 216, .5), rgba(251, 244, 216, .08) 64%, transparent 70%);
      filter: blur(.5px);
    }

    .house {
      position: absolute;
      left: 50%;
      bottom: 18vh;
      z-index: 4;
      width: min(88vw, 1180px);
      height: min(66vh, 620px);
      transform: translateX(-50%);
    }

    .wall {
      position: absolute;
      left: 8%;
      right: 5%;
      bottom: 0;
      height: 70%;
      border-radius: 2px 2px 0 0;
      background:
        linear-gradient(90deg, rgba(216, 212, 200, .7) 0 1px, transparent 1px 100%) 0 0 / 7.5rem 100%,
        linear-gradient(180deg, rgba(255,255,255,.5), transparent 28%),
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.7), transparent 18rem),
        linear-gradient(90deg, #eeeade, var(--wall) 46%, #e5e0d2);
      box-shadow:
        inset 0 0 0 1px rgba(77, 76, 68, .18),
        inset 0 -22px 36px rgba(95, 92, 78, .12),
        0 18px 46px rgba(30, 38, 40, .24);
    }

    .wall::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .42;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(95, 100, 91, .16) 1px, transparent 1.6px),
        linear-gradient(135deg, transparent 0 48%, rgba(123, 124, 113, .12) 49% 51%, transparent 52%);
      background-size: 28px 26px, 150px 150px;
      mix-blend-mode: multiply;
    }

    .wall::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 13px;
      background: linear-gradient(180deg, rgba(48, 60, 62, .28), transparent);
    }

    .roof {
      position: absolute;
      left: 0;
      right: 0;
      top: 4%;
      height: 34%;
      filter: drop-shadow(0 17px 18px rgba(30, 38, 40, .28));
    }

    .roof-main {
      position: absolute;
      left: 5.5%;
      right: 3%;
      bottom: 0;
      height: 68%;
      border-radius: 0 0 18px 18px;
      clip-path: polygon(0 78%, 8% 47%, 24% 20%, 40% 7%, 55% 2%, 74% 11%, 91% 41%, 100% 76%, 96% 90%, 78% 79%, 56% 72%, 32% 74%, 11% 87%);
      background:
        repeating-linear-gradient(100deg, transparent 0 19px, rgba(255,255,255,.11) 20px 23px, transparent 24px 40px),
        linear-gradient(180deg, #48575a 0%, var(--tile) 42%, #141b1d 100%);
    }

    .roof-main::before {
      content: "";
      position: absolute;
      inset: 16% 4% 0;
      clip-path: inherit;
      background:
        repeating-linear-gradient(90deg, rgba(238, 244, 238, .12) 0 2px, transparent 2px 34px),
        linear-gradient(180deg, transparent, rgba(0,0,0,.34));
      opacity: .88;
    }

    .roof-main::after {
      content: "";
      position: absolute;
      left: 3%;
      right: 4%;
      bottom: 7%;
      height: 26%;
      border-radius: 0 0 24px 24px;
      background:
        repeating-linear-gradient(90deg, rgba(13,18,19,.56) 0 7px, rgba(255,255,255,.1) 8px 12px, transparent 13px 38px),
        linear-gradient(180deg, rgba(39,49,51,.18), rgba(5,8,9,.58));
    }

    .eave-left,
    .eave-right {
      position: absolute;
      bottom: 7%;
      width: 21%;
      height: 32%;
      background: linear-gradient(180deg, #465356, #1c2528 64%, #0e1517);
      box-shadow: 0 10px 18px rgba(15,20,22,.28);
    }

    .eave-left {
      left: -1.2%;
      border-radius: 0 0 0 100%;
      clip-path: polygon(100% 52%, 36% 35%, 0 0, 9% 62%, 42% 85%, 100% 100%);
      transform: rotate(-3deg);
    }

    .eave-right {
      right: -1.4%;
      border-radius: 0 0 100% 0;
      clip-path: polygon(0 52%, 64% 35%, 100% 0, 91% 62%, 58% 85%, 0 100%);
      transform: rotate(3deg);
    }

    .ridge {
      position: absolute;
      left: 24%;
      right: 21%;
      top: 4%;
      height: 20%;
      border-radius: 999px 999px 20px 20px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 2px, transparent 2px 28px),
        linear-gradient(180deg, #59676a, #273134 72%, #111719);
      clip-path: polygon(2% 64%, 8% 42%, 21% 23%, 38% 8%, 54% 0, 73% 13%, 89% 38%, 98% 66%, 89% 76%, 67% 58%, 45% 49%, 21% 59%, 8% 78%);
      box-shadow: inset 0 -8px 12px rgba(0,0,0,.22);
    }

    .ridge::before,
    .ridge::after {
      content: "";
      position: absolute;
      top: 43%;
      width: 46px;
      height: 16px;
      border-top: 8px solid rgba(24, 31, 33, .88);
      border-radius: 50% 50% 0 0;
    }

    .ridge::before {
      left: 7%;
      transform: rotate(-19deg);
    }

    .ridge::after {
      right: 5%;
      transform: rotate(19deg);
    }

    .rafters {
      position: absolute;
      left: 13%;
      right: 10%;
      bottom: -2%;
      height: 14%;
      display: grid;
      grid-template-columns: repeat(21, 1fr);
      align-items: start;
      padding-inline: 4%;
    }

    .rafters span {
      display: block;
      width: 5px;
      height: 52px;
      margin-inline: auto;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(180deg, #1a2224, #455256);
      opacity: .88;
    }

    .water-curtain {
      position: absolute;
      left: 13%;
      right: 9%;
      top: 27.2%;
      z-index: 7;
      height: 22%;
      pointer-events: none;
      opacity: .78;
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    .water-curtain::before,
    .water-curtain::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 15px, rgba(229, 241, 239, .55) 16px 18px, transparent 19px 31px),
        repeating-linear-gradient(90deg, transparent 0 43px, rgba(255,255,255,.42) 44px 46px, transparent 47px 70px);
      animation: curtainFall .72s linear infinite;
    }

    .water-curtain::after {
      opacity: .55;
      transform: translateY(-40%);
      animation-duration: .48s;
      background-size: auto 54px;
    }

    .drop-line {
      position: absolute;
      top: 28%;
      z-index: 8;
      width: 2px;
      height: 76px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(240, 248, 246, .9), transparent);
      animation: drip 1.4s cubic-bezier(.35, .05, .42, 1) infinite;
      opacity: .8;
    }

    .drop-line:nth-child(1) { left: 15%; animation-delay: -.2s; height: 92px; }
    .drop-line:nth-child(2) { left: 27%; animation-delay: -.7s; }
    .drop-line:nth-child(3) { left: 42%; animation-delay: -.45s; height: 112px; }
    .drop-line:nth-child(4) { left: 61%; animation-delay: -.95s; height: 84px; }
    .drop-line:nth-child(5) { left: 80%; animation-delay: -.1s; height: 104px; }

    .windows {
      position: absolute;
      left: 17%;
      right: 13%;
      bottom: 20%;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr .82fr 1fr;
      gap: clamp(26px, 4vw, 58px);
      align-items: end;
    }

    .window {
      position: relative;
      height: clamp(160px, 24vh, 230px);
      border: 12px solid #4e3628;
      border-top-width: 16px;
      border-bottom-width: 18px;
      background:
        radial-gradient(circle at 54% 50%, rgba(255, 230, 151, .78), rgba(230, 154, 64, .34) 48%, rgba(68, 44, 30, .9) 100%);
      box-shadow:
        0 0 24px rgba(255, 206, 106, .35),
        inset 0 0 24px rgba(255, 213, 124, .5),
        inset 0 0 0 1px rgba(255,255,255,.18);
      overflow: hidden;
    }

    .window.tall {
      height: clamp(205px, 31vh, 300px);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent calc(50% - 4px), #573928 calc(50% - 4px) calc(50% + 4px), transparent calc(50% + 4px)),
        repeating-linear-gradient(0deg, transparent 0 28px, rgba(76, 51, 36, .9) 29px 35px),
        repeating-linear-gradient(90deg, transparent 0 26px, rgba(76, 51, 36, .72) 27px 32px);
    }

    .window::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 26% 24%, rgba(255,255,255,.35), transparent 18%),
        linear-gradient(120deg, transparent 12%, rgba(255,255,255,.2) 13% 16%, transparent 17% 44%, rgba(255,255,255,.13) 45% 47%, transparent 48%);
      animation: lampPulse 4.6s ease-in-out infinite;
    }

    .lattice-cap {
      position: absolute;
      left: -10px;
      right: -10px;
      top: -30px;
      height: 20px;
      background:
        repeating-linear-gradient(90deg, #563b2b 0 18px, #6e4a34 18px 24px);
      box-shadow: 0 4px 0 #2c211b;
    }

    .plinth {
      position: absolute;
      left: 7.5%;
      right: 4.5%;
      bottom: -18px;
      z-index: 6;
      height: 40px;
      background:
        repeating-linear-gradient(90deg, #5e696b 0 76px, #485458 77px 82px),
        linear-gradient(180deg, #687579, #303c41);
      border-top: 1px solid rgba(255,255,255,.32);
      box-shadow: 0 12px 20px rgba(21,29,31,.28);
    }

    .moss {
      position: absolute;
      left: 8%;
      bottom: 38%;
      z-index: 6;
      width: 72%;
      height: 38px;
      opacity: .72;
      background:
        radial-gradient(ellipse at 7% 50%, rgba(96, 123, 87, .76), transparent 62%),
        radial-gradient(ellipse at 28% 60%, rgba(87, 111, 78, .58), transparent 66%),
        radial-gradient(ellipse at 68% 44%, rgba(111, 129, 109, .55), transparent 60%);
      filter: blur(.4px);
    }

    .lantern-glow {
      position: absolute;
      right: 9%;
      bottom: 31%;
      z-index: 6;
      width: 110px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 208, 91, .28), transparent 66%);
      animation: lampPulse 3.8s ease-in-out infinite reverse;
    }

    .road {
      position: absolute;
      left: -6vw;
      right: -6vw;
      bottom: 0;
      z-index: 3;
      height: 35vh;
      min-height: 220px;
      perspective: 760px;
      background:
        linear-gradient(180deg, rgba(49, 60, 62, .02), rgba(37, 45, 47, .44));
    }

    .stones {
      position: absolute;
      inset: -6% 0 -20%;
      transform-origin: top center;
      transform: rotateX(58deg) scaleY(1.8);
      background:
        linear-gradient(88deg, transparent 0 17%, rgba(27,34,37,.4) 17.2% 17.8%, transparent 18% 34%, rgba(255,255,255,.13) 34.3% 34.9%, transparent 35% 53%, rgba(23,30,33,.44) 53.2% 54%, transparent 54.2% 73%, rgba(255,255,255,.13) 73.2% 73.9%, transparent 74%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.15) 0 2px, transparent 3px 72px),
        repeating-linear-gradient(90deg, rgba(17,24,27,.34) 0 3px, transparent 4px 112px),
        linear-gradient(180deg, #6b797b, #334145 76%, #202b2f);
      filter: saturate(.9);
    }

    .stones::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 48% 22%, rgba(255, 217, 128, .22), transparent 20%),
        radial-gradient(ellipse at 65% 48%, rgba(255, 217, 128, .18), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,.24), transparent 18%, rgba(0,0,0,.26));
      mix-blend-mode: screen;
      animation: reflectionShimmer 5.8s ease-in-out infinite;
    }

    .puddles {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 24% 62%, rgba(226, 235, 230, .38), transparent 12%),
        radial-gradient(ellipse at 51% 73%, rgba(255, 218, 128, .2), transparent 16%),
        radial-gradient(ellipse at 73% 52%, rgba(222, 233, 232, .27), transparent 12%),
        linear-gradient(180deg, transparent 10%, rgba(20, 27, 29, .24));
      filter: blur(.2px);
    }

    .puddles::before,
    .puddles::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(224, 237, 235, .58);
      border-radius: 50%;
      opacity: 0;
      animation: ripple 2.4s ease-out infinite;
    }

    .puddles::before {
      left: 31%;
      bottom: 28%;
      width: 14px;
      height: 5px;
    }

    .puddles::after {
      right: 22%;
      bottom: 38%;
      width: 22px;
      height: 8px;
      animation-delay: -1.15s;
    }

    .rain {
      position: absolute;
      inset: -18% -10% 0;
      z-index: 10;
      pointer-events: none;
      opacity: .86;
      background-image:
        repeating-linear-gradient(105deg, transparent 0 22px, var(--rain) 23px 25px, transparent 26px 54px),
        repeating-linear-gradient(105deg, transparent 0 48px, rgba(244, 249, 247, .46) 49px 50px, transparent 51px 94px);
      background-size: 180px 180px, 250px 250px;
      animation: rainFall .58s linear infinite;
    }

    .rain.back {
      z-index: 3;
      opacity: .34;
      filter: blur(.5px);
      animation-duration: 1.1s;
    }

    .foreground-vignette {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(21,27,29,.2), transparent 24%, transparent 76%, rgba(10,15,16,.4)),
        radial-gradient(ellipse at center, transparent 43%, rgba(16,21,22,.34) 100%);
    }

    .title-block {
      position: absolute;
      left: clamp(22px, 5vw, 72px);
      top: clamp(22px, 6vh, 58px);
      z-index: 13;
      color: rgba(248, 244, 229, .92);
      text-shadow: 0 2px 12px rgba(20, 27, 29, .38);
      writing-mode: vertical-rl;
      letter-spacing: .16em;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(34px, 4.4vw, 58px);
      font-weight: 500;
      line-height: 1.05;
    }

    .title-block p {
      margin: 18px 10px 0 0;
      font-size: clamp(13px, 1.4vw, 17px);
      color: rgba(246, 235, 203, .78);
    }

    .seal {
      position: absolute;
      left: clamp(24px, 5vw, 76px);
      top: clamp(270px, 47vh, 420px);
      z-index: 13;
      width: 38px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(144, 54, 45, .75);
      color: rgba(144, 54, 45, .88);
      background: rgba(243, 240, 230, .14);
      font-size: 16px;
      line-height: 1;
      writing-mode: vertical-rl;
      letter-spacing: .08em;
      box-shadow: inset 0 0 0 3px rgba(144, 54, 45, .09);
    }

    @keyframes rainFall {
      from { background-position: 0 0, 0 0; }
      to { background-position: -72px 180px, -98px 250px; }
    }

    @keyframes curtainFall {
      from { transform: translateY(-32px); }
      to { transform: translateY(32px); }
    }

    @keyframes drip {
      0% { transform: translateY(-30px); opacity: 0; }
      18% { opacity: .88; }
      84% { opacity: .62; }
      100% { transform: translateY(190px); opacity: 0; }
    }

    @keyframes ripple {
      0% { transform: scale(.2); opacity: 0; }
      22% { opacity: .7; }
      100% { transform: scale(5.4); opacity: 0; }
    }

    @keyframes lampPulse {
      0%, 100% { opacity: .82; filter: saturate(.95); }
      50% { opacity: 1; filter: saturate(1.18); }
    }

    @keyframes reflectionShimmer {
      0%, 100% { opacity: .7; transform: translateY(0); }
      50% { opacity: .95; transform: translateY(7px); }
    }

    @keyframes mistDrift {
      from { transform: translate3d(-1.5%, 0, 0); }
      to { transform: translate3d(1.5%, -1%, 0); }
    }

    @media (max-width: 760px) {
      .scene {
        min-height: 620px;
      }

      .house {
        width: 124vw;
        left: 57%;
        bottom: 17vh;
        height: 58vh;
      }

      .windows {
        left: 19%;
        right: 16%;
        gap: 18px;
      }

      .window {
        height: 150px;
        border-width: 8px;
        border-top-width: 12px;
        border-bottom-width: 13px;
      }

      .window:nth-child(1) {
        display: none;
      }

      .windows {
        grid-template-columns: .95fr 1fr;
      }

      .title-block {
        left: 18px;
        top: 22px;
      }

      .seal {
        left: 20px;
        top: 250px;
      }

      .road {
        height: 32vh;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="江南雨中白墙黛瓦建筑特写">
    <div class="moon-mark" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div class="distant-roof" aria-hidden="true"></div>
    <div class="rain back" aria-hidden="true"></div>

    <section class="house" aria-label="白墙黛瓦、飞檐翘角与木窗暖灯">
      <div class="wall"></div>
      <div class="moss"></div>
      <div class="roof" aria-hidden="true">
        <div class="ridge"></div>
        <div class="eave-left"></div>
        <div class="eave-right"></div>
        <div class="roof-main"></div>
        <div class="rafters">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="water-curtain" aria-hidden="true"></div>
      <i class="drop-line" aria-hidden="true"></i>
      <i class="drop-line" aria-hidden="true"></i>
      <i class="drop-line" aria-hidden="true"></i>
      <i class="drop-line" aria-hidden="true"></i>
      <i class="drop-line" aria-hidden="true"></i>

      <div class="windows">
        <div class="window">
          <span class="lattice-cap"></span>
        </div>
        <div class="window tall">
          <span class="lattice-cap"></span>
        </div>
        <div class="window">
          <span class="lattice-cap"></span>
        </div>
      </div>
      <div class="lantern-glow" aria-hidden="true"></div>
      <div class="plinth" aria-hidden="true"></div>
    </section>

    <section class="road" aria-label="雨湿青石板路">
      <div class="stones"></div>
      <div class="puddles"></div>
    </section>

    <div class="title-block" aria-label="白墙黛瓦">
      <h1>白墙黛瓦</h1>
      <p>雨入江南，檐声如帘</p>
    </div>
    <div class="seal" aria-hidden="true">雨巷</div>

    <div class="rain" aria-hidden="true"></div>
    <div class="foreground-vignette" aria-hidden="true"></div>
  </main>

<script>
(function(){
  "use strict";
  function lock() {
    var h = window.innerHeight;
    document.documentElement.style.setProperty("height", h + "px", "important");
    document.documentElement.style.setProperty("overflow", "hidden", "important");
    document.body.style.setProperty("height", h + "px", "important");
    document.body.style.setProperty("overflow", "hidden", "important");
    window.scrollTo(0, 0);
  }
  lock();
  window.addEventListener("resize", lock);
  window.addEventListener("scroll", function(){ window.scrollTo(0, 0); }, {capture: true, passive: false});
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive: false});
})();
</script>
