<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小桥流水</title>
  <style>
    :root {
      --willow: #4f8f66;
      --willow-dark: #2f6a52;
      --water: #5b8f94;
      --water-deep: #315f68;
      --stone: #8a9691;
      --tile: #283a3f;
      --wall: #fff7e8;
      --paper: #f8f1df;
      --ink: #263a3b;
      --sun: #f2ca82;
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow: clip;
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      height: 100%;
      overflow: clip;
      color: var(--ink);
      font-family: "STSong", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
      background:
        radial-gradient(circle at 72% 15%, rgba(242, 202, 130, .32), transparent 23rem),
        linear-gradient(180deg, #dceee3 0%, #f5eedc 53%, #cbdfd5 100%);
    }

    .scene {
      position: relative;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .title {
      position: absolute;
      z-index: 5;
      top: clamp(22px, 5vw, 54px);
      left: clamp(18px, 6vw, 78px);
      max-width: min(560px, calc(100vw - 36px));
      text-shadow: 0 2px 18px rgba(255, 247, 232, .7);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.8rem, 12vw, 10rem);
      font-weight: 500;
      line-height: .92;
      letter-spacing: 0;
    }

    .seal {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-top: 18px;
      border: 2px solid #9f3f32;
      color: #9f3f32;
      font-size: 1rem;
      line-height: 1.05;
      font-family: "Kaiti SC", "STKaiti", serif;
      background: rgba(255, 247, 232, .58);
    }

    .poem {
      position: absolute;
      z-index: 6;
      right: clamp(16px, 5vw, 72px);
      top: clamp(32px, 9vw, 94px);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: clamp(1rem, 1.7vw, 1.35rem);
      line-height: 1.9;
      letter-spacing: .12em;
      color: rgba(38, 58, 59, .82);
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .mist {
      position: absolute;
      inset: auto -12% 41% -12%;
      height: 16vh;
      z-index: 3;
      opacity: .34;
      background:
        radial-gradient(ellipse at 20% 55%, rgba(255, 247, 232, .9), transparent 36%),
        radial-gradient(ellipse at 52% 45%, rgba(255, 247, 232, .85), transparent 40%),
        radial-gradient(ellipse at 84% 56%, rgba(255, 247, 232, .78), transparent 34%);
      filter: blur(18px);
      animation: drift 18s ease-in-out infinite alternate;
    }

    .water-sparkle {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 43vh;
      z-index: 4;
      pointer-events: none;
      background-image:
        linear-gradient(100deg, transparent 0 42%, rgba(255, 247, 232, .72) 48%, transparent 55%),
        linear-gradient(80deg, transparent 0 46%, rgba(238, 246, 226, .5) 50%, transparent 57%),
        linear-gradient(100deg, transparent 0 44%, rgba(255, 247, 232, .5) 49%, transparent 55%);
      background-size: 280px 20px, 210px 16px, 360px 26px;
      background-position: 0 14%, 80px 38%, -40px 66%;
      mix-blend-mode: screen;
      opacity: .45;
      transform: skewY(-5deg);
      animation: shimmer 8s linear infinite;
    }

    .credit {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 7px 13px;
      border: 1px solid rgba(40, 58, 63, .16);
      border-radius: 999px;
      color: rgba(38, 58, 59, .64);
      background: rgba(255, 247, 232, .42);
      backdrop-filter: blur(8px);
      font-size: .8rem;
      white-space: nowrap;
    }

    .boat {
      transform-origin: 50% 50%;
      animation: boat-glide 24s ease-in-out infinite;
    }

    .boat-shadow {
      animation: shadow-glide 24s ease-in-out infinite;
    }

    .willow-left {
      transform-origin: 72px 116px;
      animation: willow-sway 6s ease-in-out infinite alternate;
    }

    .willow-right {
      transform-origin: 1124px 118px;
      animation: willow-sway-right 7s ease-in-out infinite alternate;
    }

    .water-line {
      stroke-dasharray: 18 24;
      animation: current 9s linear infinite;
    }

    .reflection {
      opacity: .34;
      filter: url(#softBlur);
      transform-origin: 600px 640px;
      animation: reflection 5.5s ease-in-out infinite alternate;
    }

    @keyframes boat-glide {
      0%, 100% { transform: translateX(-58px) translateY(5px) rotate(-.3deg); }
      50% { transform: translateX(104px) translateY(-7px) rotate(.45deg); }
    }

    @keyframes shadow-glide {
      0%, 100% { transform: translateX(-54px); opacity: .18; }
      50% { transform: translateX(104px); opacity: .24; }
    }

    @keyframes willow-sway {
      from { transform: rotate(-1deg); }
      to { transform: rotate(2.4deg); }
    }

    @keyframes willow-sway-right {
      from { transform: rotate(1.4deg); }
      to { transform: rotate(-2deg); }
    }

    @keyframes current {
      to { stroke-dashoffset: -180; }
    }

    @keyframes shimmer {
      to { background-position: 280px 14%, 290px 38%, 320px 66%; }
    }

    @keyframes drift {
      to { transform: translateX(4%); }
    }

    @keyframes reflection {
      from { transform: scaleY(.98) skewX(-1deg); }
      to { transform: scaleY(1.03) skewX(1.2deg); }
    }

    @media (max-width: 720px) {
      .scene {
        min-height: 100svh;
      }

      .poem {
        top: auto;
        bottom: 72px;
        right: 14px;
        font-size: .92rem;
        color: rgba(38, 58, 59, .72);
      }

      .seal {
        width: 36px;
        height: 36px;
        font-size: .86rem;
      }

      .credit {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="小桥流水江南水乡画面">

    <div class="mist"></div>
    <div class="water-sparkle"></div>
    <div class="credit">翠绿 · 青灰 · 暖白</div>
  </main>

<script>
(function(){
  "use strict";
  function lock() {
    var h = window.innerHeight;
    document.documentElement.style.setProperty("height", h + "px", "important");
    document.documentElement.style.setProperty("overflow", "hidden", "important");
    document.body.style.setProperty("height", h + "px", "important");
    document.body.style.setProperty("overflow", "hidden", "important");
    window.scrollTo(0, 0);
  }
  lock();
  window.addEventListener("resize", lock);
  window.addEventListener("scroll", function(){ window.scrollTo(0, 0); }, {capture: true, passive: false});
  document.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive: false});
})();
</script>
</body>
</html>
