<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江南烟雨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, 
                #d4d8dc 0%, 
                #b8bcc2 30%, 
                #a5aab2 50%, 
                #8b95a0 70%, 
                #6b7580 100%);
            overflow: hidden;
            font-family: "KaiTi", "楷体", "STKaiti", serif;
            position: relative;
        }

        /* 远山背景 */
        .mountains {
            position: absolute;
            bottom: 40%;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 1;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(60, 70, 80, 0.3) 50%, 
                rgba(40, 50, 60, 0.5) 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .mountain:nth-child(1) {
            left: -10%;
            width: 40%;
            height: 200px;
        }

        .mountain:nth-child(2) {
            left: 20%;
            width: 50%;
            height: 280px;
            z-index: 2;
        }

        .mountain:nth-child(3) {
            left: 50%;
            width: 45%;
            height: 220px;
        }

        .mountain:nth-child(4) {
            left: 75%;
            width: 35%;
            height: 180px;
            z-index: 2;
        }

        /* 水面 */
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg,
                rgba(100, 120, 140, 0.3) 0%,
                rgba(70, 90, 110, 0.5) 50%,
                rgba(50, 70, 90, 0.7) 100%);
            z-index: 5;
            overflow: hidden;
        }

        /* 涟漪 */
        .ripple {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rippleExpand 3s ease-out infinite;
        }

        @keyframes rippleExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                border-width: 2px;
            }
            100% {
                width: 150px;
                height: 50px;
                opacity: 0;
                border-width: 0px;
            }
        }

        /* 小船 */
        .boat-container {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: boatFloat 4s ease-in-out infinite;
        }

        @keyframes boatFloat {
            0%, 100% {
                transform: translateX(-50%) translateY(0) rotate(-1deg);
            }
            50% {
                transform: translateX(-50%) translateY(-10px) rotate(1deg);
            }
        }

        .boat {
            position: relative;
            width: 120px;
            height: 60px;
        }

        .boat-body {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 100px;
            height: 25px;
            background: linear-gradient(180deg,
                #3d2817 0%,
                #2a1a0f 100%);
            border-radius: 5px 5px 15px 15px;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        .boat-canopy {
            position: absolute;
            bottom: 20px;
            left: 25px;
            width: 70px;
            height: 35px;
            background: linear-gradient(180deg,
                #5a4a3a 0%,
                #3d2817 100%);
            border-radius: 50% 50% 0 0;
        }

        .boat-canopy::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 10px;
            width: 50px;
            height: 2px;
            background: rgba(0, 0, 0, 0.3);
        }

        .boat-canopy::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 10px;
            width: 50px;
            height: 2px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* 雨丝 */
        .rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            width: 1px;
            height: 20px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0.6) 100%);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* 花瓣 */
        .petals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg,
                #ffb7c5 0%,
                #ff9eb5 50%,
                #ff8da1 100%);
            border-radius: 0 50% 50% 50%;
            transform: rotate(45deg);
            opacity: 0.8;
            animation: petalFall linear infinite;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            25% {
                transform: translateY(25vh) rotate(90deg) translateX(20px);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(-10px);
            }
            75% {
                transform: translateY(75vh) rotate(270deg) translateX(15px);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 油纸伞 */
        .umbrella-container {
            position: absolute;
            top: 20%;
            right: 15%;
            z-index: 25;
            animation: umbrellaSway 3s ease-in-out infinite;
        }

        @keyframes umbrellaSway {
            0%, 100% {
                transform: rotate(-3deg);
            }
            50% {
                transform: rotate(3deg);
            }
        }

        .umbrella {
            position: relative;
            width: 100px;
            height: 80px;
        }

        .umbrella-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
            background: radial-gradient(ellipse at center top,
                #c41e3a 0%,
                #8b0000 70%,
                #5c0000 100%);
            border-radius: 50% 50% 10% 10%;
            clip-path: polygon(
                50% 0%,
                0% 100%,
                10% 100%,
                20% 85%,
                30% 100%,
                40% 85%,
                50% 100%,
                60% 85%,
                70% 100%,
                80% 85%,
                90% 100%,
                100% 100%
            );
        }

        .umbrella-top::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
        }

        .umbrella-handle {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 35px;
            background: linear-gradient(90deg,
                #3d2817 0%,
                #5a4a3a 50%,
                #3d2817 100%);
            border-radius: 0 0 3px 3px;
        }

        .umbrella-handle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 8px;
            background: #2a1a0f;
            border-radius: 0 0 6px 6px;
        }

        /* 标题文字 */
        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
        }

        .title h1 {
            font-size: 4rem;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            letter-spacing: 20px;
            font-weight: normal;
            animation: titleFade 2s ease-out;
        }

        .title p {
            font-size: 1.2rem;
            color: #4a5568;
            margin-top: 10px;
            letter-spacing: 5px;
            opacity: 0;
            animation: subtitleFade 2s ease-out 1s forwards;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtitleFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 印章 */
        .seal {
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 60px;
            height: 60px;
            border: 3px solid #c41e3a;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #c41e3a;
            background: rgba(196, 30, 58, 0.1);
            clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
            animation: sealFade 3s ease-out 2s forwards;
            opacity: 0;
        }

        @keyframes sealFade {
            to {
                opacity: 1;
            }
        }

        /* 薄雾效果 */
        .mist {
            position: absolute;
            bottom: 35%;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 100%);
            z-index: 8;
            filter: blur(20px);
            animation: mistMove 8s ease-in-out infinite;
        }

        @keyframes mistMove {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            50% {
                opacity: 0.6;
                transform: translateY(-10px);
            }
        }

        /* 飞鸟 */
        .birds {
            position: absolute;
            top: 15%;
            left: 20%;
            z-index: 3;
        }

        .bird {
            position: absolute;
            width: 20px;
            height: 10px;
            animation: birdFly 15s linear infinite;
        }

        .bird::before,
        .bird::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 3px;
            border-top: 2px solid #2c3e50;
            border-right: 2px solid #2c3e50;
        }

        .bird::before {
            left: 0;
            top: 5px;
            transform: rotate(-45deg);
        }

        .bird::after {
            right: 0;
            top: 5px;
            transform: rotate(45deg) scaleX(-1);
        }

        .bird:nth-child(1) { animation-delay: 0s; }
        .bird:nth-child(2) { animation-delay: 0.5s; left: 30px; }
        .bird:nth-child(3) { animation-delay: 1s; left: 60px; }

        @keyframes birdFly {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(300px) translateY(-30px);
                opacity: 0;
            }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .title h1 {
                font-size: 2.5rem;
                letter-spacing: 10px;
            }

            .title p {
                font-size: 0.9rem;
                letter-spacing: 3px;
            }

            .boat-container {
                bottom: 30%;
            }

            .boat {
                transform: scale(0.8);
            }

            .umbrella-container {
                top: 15%;
                right: 10%;
                transform: scale(0.7);
            }

            .seal {
                width: 45px;
                height: 45px;
                font-size: 0.9rem;
                bottom: 5%;
            }

            .mountain:nth-child(2) {
                left: 10%;
            }

            .mountain:nth-child(3) {
                left: 40%;
            }
        }

        @media (max-width: 480px) {
            .title h1 {
                font-size: 1.8rem;
                letter-spacing: 5px;
            }

            .title p {
                font-size: 0.75rem;
            }

            .boat {
                transform: scale(0.6);
            }

            .umbrella-container {
                transform: scale(0.5);
            }
        }

        /* 水面波纹动画 */
        .water-surface {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 50px,
                rgba(255, 255, 255, 0.05) 50px,
                rgba(255, 255, 255, 0.05) 100px
            );
            animation: waterShimmer 4s linear infinite;
        }

        @keyframes waterShimmer {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 100px 0;
            }
        }
    </style>
</head>
<body>
    <!-- 远山 -->
    <div class="mountains">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
    </div>

    <!-- 飞鸟 -->
    <div class="birds">
        <div class="bird"></div>
        <div class="bird"></div>
        <div class="bird"></div>
    </div>

    <!-- 薄雾 -->
    <div class="mist"></div>

    <!-- 雨丝 -->
    <div class="rain" id="rain"></div>

    <!-- 花瓣 -->
    <div class="petals" id="petals"></div>

    <!-- 油纸伞 -->
    <div class="umbrella-container">
        <div class="umbrella">
            <div class="umbrella-top"></div>
            <div class="umbrella-handle"></div>
        </div>
    </div>

    <!-- 小船 -->
    <div class="boat-container">
        <div class="boat">
            <div class="boat-body"></div>
            <div class="boat-canopy"></div>
        </div>
    </div>

    <!-- 水面 -->
    <div class="water">
        <div class="water-surface"></div>
        <div id="ripples"></div>
    </div>

    <!-- 标题 -->
    <div class="title">
        <h1>江南烟雨</h1>
        <p>烟雨入江南 · 水墨绘丹青</p>
    </div>

    <!-- 印章 -->
    <div class="seal">江南</div>

    <script>
        // 创建雨滴
        function createRaindrops() {
            const rainContainer = document.getElementById('rain');
            const raindropCount = 100;

            for (let i = 0; i < raindropCount; i++) {
                const raindrop = document.createElement('div');
                raindrop.className = 'raindrop';
                raindrop.style.left = Math.random() * 100 + '%';
                raindrop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                raindrop.style.animationDelay = Math.random() * 2 + 's';
                raindrop.style.opacity = 0.3 + Math.random() * 0.4;
                raindrop.style.height = (15 + Math.random() * 10) + 'px';
                rainContainer.appendChild(raindrop);
            }
        }

        // 创建花瓣
        function createPetals() {
            const petalsContainer = document.getElementById('petals');
            const petalCount = 20;

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (5 + Math.random() * 5) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                petal.style.width = (8 + Math.random() * 8) + 'px';
                petal.style.height = petal.style.width;
                petalsContainer.appendChild(petal);
            }
        }

        // 创建涟漪
        function createRipples() {
            const ripplesContainer = document.getElementById('ripples');
            
            setInterval(() => {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = (20 + Math.random() * 60) + '%';
                ripple.style.top = (20 + Math.random() * 60) + '%';
                ripple.style.animationDelay = '0s';
                ripplesContainer.appendChild(ripple);

                // 移除已完成的涟漪
                setTimeout(() => {
                    ripple.remove();
                }, 3000);
            }, 800);
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            createRaindrops();
            createPetals();
            createRipples();
        });

        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            const rainContainer = document.getElementById('rain');
            const petalsContainer = document.getElementById('petals');
            rainContainer.innerHTML = '';
            petalsContainer.innerHTML = '';
            createRaindrops();
            createPetals();
        });
    </script>
</body>
</html>
